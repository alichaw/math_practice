<title>會考數學公式教練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ── tokens ─────────────────────────────────────────────────────────── */
:root{
  --paper:#F2EEE4; --sheet:#FCFAF5; --sheet-2:#EFEADC;
  --ink:#16273D; --ink-soft:#5A6A7D; --ink-faint:#8A96A3;
  --teal:#0C7361; --teal-bg:#E1EFEA; --teal-line:#9CC9BE;
  --amber:#A9700B; --amber-bg:#F6EBD5; --amber-line:#DCC08A;
  --red:#9E3535; --red-bg:#F6E4E1; --red-line:#DCACA4;
  --rule:#D9D2C4; --rule-soft:#E7E1D4;
  --focus:#0C7361;
  --shadow:0 1px 0 rgba(22,39,61,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A20; --sheet:#1C242C; --sheet-2:#232D36;
    --ink:#E9E4D8; --ink-soft:#9FADBA; --ink-faint:#77848F;
    --teal:#4FC3AB; --teal-bg:#13322D; --teal-line:#2E6C5E;
    --amber:#E3A44A; --amber-bg:#332612; --amber-line:#6E5628;
    --red:#E88B80; --red-bg:#361D1B; --red-line:#6E3B36;
    --rule:#2E3A45; --rule-soft:#26313A;
    --focus:#4FC3AB;
    --shadow:0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#141A20; --sheet:#1C242C; --sheet-2:#232D36;
  --ink:#E9E4D8; --ink-soft:#9FADBA; --ink-faint:#77848F;
  --teal:#4FC3AB; --teal-bg:#13322D; --teal-line:#2E6C5E;
  --amber:#E3A44A; --amber-bg:#332612; --amber-line:#6E5628;
  --red:#E88B80; --red-bg:#361D1B; --red-line:#6E3B36;
  --rule:#2E3A45; --rule-soft:#26313A;
  --focus:#4FC3AB;
  --shadow:0 1px 0 rgba(0,0,0,.3);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── shell ──────────────────────────────────────────────────────────── */
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--sheet);
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;overflow-x:hidden}
@media (max-width:479px){.app{border-left:none;border-right:none}}
.topbar{position:sticky;top:0;z-index:30;background:var(--sheet);
  border-bottom:1px solid var(--rule);padding:10px 16px 8px;
  display:flex;align-items:baseline;gap:8px}
.topbar h1{margin:0;font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;letter-spacing:.02em}
.topbar .sub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);margin-left:auto;letter-spacing:.04em}
.main{flex:1;padding:14px 16px 92px}

/* ── bottom nav ─────────────────────────────────────────────────────── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--sheet);
  border-top:1px solid var(--rule);display:flex;
  max-width:460px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0)}
.nav button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-soft);font-size:11px;letter-spacing:.02em;
  border-top:2px solid transparent;margin-top:-1px;transition:color .18s ease,border-color .18s ease}
.nav button[aria-current="page"]{color:var(--teal);border-top-color:var(--teal);font-weight:700}
.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.nav .badge{position:absolute;transform:translate(13px,-13px);background:var(--amber);
  color:#FFF9EC;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  min-width:16px;height:16px;line-height:16px;border-radius:8px;padding:0 4px}
:root[data-theme="dark"] .nav .badge,
:root:not([data-theme="light"]) .nav .badge{color:#1A1206}

/* ── structural type ────────────────────────────────────────────────── */
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
.secthead{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.secthead:first-child{margin-top:4px}
.secthead .line{flex:1;height:1px;background:var(--rule)}
.secthead h2{margin:0;font-family:"Noto Serif TC",serif;font-size:15px;font-weight:700;letter-spacing:.02em}
h3{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:700;margin:0;text-wrap:balance}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}

/* ── note block ─────────────────────────────────────────────────────── */
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:14px}
.block+.block{margin-top:10px}
.block.tint{background:var(--sheet-2)}
.rulebox{border-left:1px solid var(--rule);padding-left:14px;margin-left:3px}

/* margin-rule list: real sequences only */
ol.steps{list-style:none;margin:0;padding:0 0 0 30px;position:relative}
ol.steps::before{content:"";position:absolute;left:14px;top:4px;bottom:4px;width:1px;background:var(--rule)}
ol.steps li{position:relative;margin-bottom:10px}
ol.steps li:last-child{margin-bottom:0}
ol.steps li::before{content:counter(sc);counter-increment:sc;position:absolute;left:-30px;width:21px;
  text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--ink-faint);top:2px}
/* 巢狀時只留外層的邊界線，避免兩條平行的直線 */
.rulebox ol.steps{padding-left:26px}
.rulebox ol.steps::before{display:none}
.rulebox ol.steps li::before{left:-26px;width:17px}
ol.steps{counter-reset:sc}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{position:relative;padding-left:15px;margin-bottom:6px}
ul.plain li:last-child{margin-bottom:0}
ul.plain li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:1px;background:var(--ink-faint)}

/* ── tags ───────────────────────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1.5;
  padding:1px 7px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-soft);
  background:var(--sheet-2);white-space:nowrap}
.tag.amber{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.tag.teal{color:var(--teal);border-color:var(--teal-line);background:var(--teal-bg)}
.tag.red{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}
.tag.ghost{background:transparent}
.tagrow{display:flex;flex-wrap:wrap;gap:5px}

/* ── buttons ────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:10px 16px;border-radius:4px;border:1px solid var(--ink);
  background:var(--ink);color:var(--sheet);font-weight:700;font-size:15px;width:100%;
  transition:opacity .18s ease,background-color .18s ease}
.btn:hover{opacity:.88}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#FBFEFD}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#0B1F1A}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule);font-weight:500}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red-line);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;width:auto}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{width:auto;flex:1}

/* ── chips (filters, options, tokens) ───────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:32px;padding:4px 11px;border:1px solid var(--rule);border-radius:16px;
  font-size:12.5px;color:var(--ink-soft);background:var(--sheet);
  transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet);font-weight:500}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  min-height:46px;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;
  background:var(--sheet);margin-bottom:8px;transition:border-color .18s ease,background-color .18s ease}
.opt:last-child{margin-bottom:0}
.opt .key{flex:none;width:20px;height:20px;border:1px solid var(--rule);border-radius:3px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;line-height:19px;
  text-align:center;color:var(--ink-soft);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--sheet-2)}
.opt[aria-pressed="true"] .key{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.opt.ok{border-color:var(--teal);background:var(--teal-bg)}
.opt.ok .key{background:var(--teal);border-color:var(--teal);color:#FBFEFD}
.opt.bad{border-color:var(--red);background:var(--red-bg)}
.opt.bad .key{background:var(--red);border-color:var(--red);color:#FFF6F5}
.opt .mark{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.ok .mark{color:var(--teal)}
.opt.bad .mark{color:var(--red)}

/* ── math ───────────────────────────────────────────────────────────── */
.m{font-family:"Noto Serif TC",Georgia,"Times New Roman",serif;line-height:1.15;
  white-space:nowrap;display:inline-block;vertical-align:-.15em}
.m .v{font-style:italic;padding-right:.03em}
.m .n{font-family:"IBM Plex Mono",monospace;font-size:.92em;font-variant-numeric:tabular-nums}
.m .op{padding:0 .22em}
.m .rel{padding:0 .3em}
.m .fn{padding-right:.12em}
.m .tx{font-family:"Noto Sans TC",sans-serif;font-style:normal;font-size:.9em;padding:0 .08em}
.m .sup{font-size:.72em;vertical-align:.52em;line-height:0}
.m .sub{font-size:.72em;vertical-align:-.28em;line-height:0}
.m .frac{display:inline-flex;flex-direction:column;vertical-align:middle;
  text-align:center;margin:0 .15em;font-size:.94em}
.m .frac>span{padding:0 .28em;display:block}
.m .frac.dfrac{font-size:1.06em}
.m .frac .den{border-top:1px solid currentColor;padding-top:.08em;margin-top:.08em}
.m .sqrt{display:inline-flex;align-items:stretch;margin:0 .06em}
.m .sqrt .sign{font-size:1.06em;line-height:1;transform:scaleY(1.12);transform-origin:bottom}
.m .sqrt .cand{border-top:1px solid currentColor;padding:.1em .16em 0 .06em;margin-top:.14em}
.m .ovl{border-top:1px solid currentColor;padding-top:.04em}
.m.blk{display:block;white-space:normal;text-align:center;font-size:1.14em;
  padding:8px 2px;overflow-x:auto;overflow-y:hidden}
/* 展示型公式：純算式沒有斷點會維持一行，含中文的長公式才會在中文處折行 */
.m.blk>span{white-space:normal}
.m.blk .frac,.m.blk .sqrt,.m.blk .ovl,.m.blk .sc{white-space:nowrap}
.m .sc{white-space:nowrap}
/* 清單裡的長公式改成折行，不要橫向捲動 */
.m.flow{display:block;white-space:normal;text-align:left;line-height:1.9;vertical-align:baseline}
.m.flow>span{white-space:normal}
.m.flow .frac,.m.flow .sqrt,.m.flow .ovl,.m.flow .sc{white-space:nowrap}
.mwrap{overflow-x:auto;max-width:100%}
.formula-card{background:var(--sheet-2);border:1px solid var(--rule);border-radius:4px;
  padding:6px 10px;margin:2px 0}
.formula-card.hidden{background:repeating-linear-gradient(135deg,var(--sheet-2),var(--sheet-2) 6px,var(--sheet) 6px,var(--sheet) 12px);
  color:var(--ink-faint);text-align:center;padding:14px 10px;font-size:13px}

/* ── blanks / token bank ────────────────────────────────────────────── */
.blank{display:inline-block;min-width:52px;min-height:30px;padding:1px 8px;margin:0 3px;
  border:1px dashed var(--ink-faint);border-radius:3px;background:var(--sheet);
  vertical-align:middle;text-align:center;line-height:26px;
  transition:border-color .18s ease,background-color .18s ease}
.blank.active{border-style:solid;border-color:var(--teal);background:var(--teal-bg);border-width:2px}
.blank.filled{border-style:solid;border-color:var(--rule)}
.blank.ok{border-color:var(--teal);background:var(--teal-bg)}
.blank.bad{border-color:var(--red);background:var(--red-bg)}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.token{min-height:40px;padding:5px 13px;border:1px solid var(--rule);border-radius:4px;
  background:var(--sheet-2);transition:transform .18s ease,opacity .18s ease}
.token:active{transform:translateY(1px)}
.token.used{opacity:.32;pointer-events:none}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.keypad button{min-height:44px;border:1px solid var(--rule);border-radius:4px;
  background:var(--sheet-2);font-family:"IBM Plex Mono",monospace;font-size:16px}
.numview{min-height:46px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);
  display:flex;align-items:center;justify-content:center;padding:6px 12px;margin-top:4px}

/* ── figures ────────────────────────────────────────────────────────── */
.figure{border:1px solid var(--rule);border-radius:4px;padding:6px;background:var(--sheet);
  background-image:linear-gradient(var(--rule-soft) 1px,transparent 1px),
    linear-gradient(90deg,var(--rule-soft) 1px,transparent 1px);
  background-size:16px 16px;background-position:-1px -1px}
.figure svg{display:block;width:100%;height:auto}
.figcap{font-size:11.5px;color:var(--ink-soft);padding:6px 4px 2px;line-height:1.5;text-align:center}
svg .stk{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
svg .thin{stroke:var(--ink-soft);fill:none;stroke-width:1;stroke-linecap:round}
svg .dash{stroke:var(--ink-soft);fill:none;stroke-width:1.2;stroke-dasharray:4 3;stroke-linecap:round}
svg .hl{stroke:var(--amber);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .hl2{stroke:var(--teal);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .fillA{fill:var(--amber-bg);stroke:var(--amber-line);stroke-width:1}
svg .fillT{fill:var(--teal-bg);stroke:var(--teal-line);stroke-width:1}
svg text{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:11px;fill:var(--ink)}
svg text.lbl{font-family:"Noto Serif TC",Georgia,serif;font-style:italic;font-size:12.5px}
svg text.sm{font-size:9.5px;fill:var(--ink-soft)}
svg text.acc{fill:var(--amber);font-weight:600}
svg text.acc2{fill:var(--teal);font-weight:600}
/* 描邊光暈：讓標籤壓在格線或粗線上時仍然看得清楚 */
svg text.acc,svg text.acc2,svg text.halo{paint-order:stroke;stroke:var(--sheet);
  stroke-width:3px;stroke-linejoin:round}
svg .axis{stroke:var(--ink-soft);stroke-width:1.1}
svg .grid{stroke:var(--rule);stroke-width:.7}
svg .curve{stroke:var(--teal);stroke-width:2;fill:none;stroke-linecap:round}
svg .curve2{stroke:var(--amber);stroke-width:2;fill:none;stroke-dasharray:5 3;stroke-linecap:round}
svg .curve3{stroke:var(--ink-soft);stroke-width:1.6;fill:none;stroke-dasharray:1.5 3;stroke-linecap:round}
svg .dot{fill:var(--ink)}
svg .dotA{fill:var(--amber)}
svg .dotT{fill:var(--teal)}

/* ── stats ──────────────────────────────────────────────────────────── */
.metric{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.metric:last-child{border-bottom:none}
.metric .name{font-size:13.5px}
.metric .val{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums}
.metric .sub{grid-column:1/-1;font-size:11.5px;color:var(--ink-faint);
  font-family:"IBM Plex Mono",monospace}
.bar{grid-column:1/-1;height:5px;background:var(--sheet-2);border:1px solid var(--rule-soft);
  border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--teal);transition:width .22s ease}
.bar i.low{background:var(--amber)}
.bar i.zero{background:var(--ink-faint)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid var(--rule-soft);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv b{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}

/* ── list rows ──────────────────────────────────────────────────────── */
.row{display:block;width:100%;text-align:left;background:var(--sheet);
  border:1px solid var(--rule);border-radius:4px;padding:11px 12px;margin-bottom:8px;
  transition:border-color .18s ease}
.row:hover{border-color:var(--ink-faint)}
.row .rtop{display:flex;align-items:baseline;gap:8px}
.row .rtitle{font-family:"Noto Serif TC",serif;font-weight:700;font-size:14.5px;flex:1;
  text-wrap:balance;line-height:1.45}
.row .rmeta{font-size:11.5px;color:var(--ink-faint);margin-top:3px;
  display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.dotmark{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.dotmark.m0{background:var(--ink-faint)}
.dotmark.m1{background:var(--amber)}
.dotmark.m2{background:var(--teal)}

/* ── sheet / modal ──────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.44);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheetbox{background:var(--sheet);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
  overflow-x:hidden;border-radius:8px 8px 0 0;border-top:1px solid var(--rule);
  animation:rise .22s ease;padding-bottom:env(safe-area-inset-bottom,0)}
.sheethead{position:sticky;top:0;background:var(--sheet);border-bottom:1px solid var(--rule);
  padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.sheethead h3{flex:1}
.sheetbody{padding:14px 16px 20px}
.xbtn{flex:none;width:32px;height:32px;border:1px solid var(--rule);border-radius:4px;
  color:var(--ink-soft);font-size:16px;line-height:1}
.modal{background:var(--sheet);width:100%;max-width:360px;margin:auto;border-radius:6px;
  border:1px solid var(--rule);padding:18px}
.scrim.center{align-items:center;padding:16px}

/* ── misc ───────────────────────────────────────────────────────────── */
.banner{border:1px solid var(--amber-line);background:var(--amber-bg);color:var(--amber);
  border-radius:4px;padding:9px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.banner.teal{border-color:var(--teal-line);background:var(--teal-bg);color:var(--teal)}
.banner.red{border-color:var(--red-line);background:var(--red-bg);color:var(--red)}
.progressline{display:flex;gap:3px;margin-bottom:12px}
.progressline i{flex:1;height:3px;background:var(--rule);border-radius:2px}
.progressline i.done{background:var(--teal)}
.progressline i.now{background:var(--ink)}
.progressline i.miss{background:var(--red)}
textarea.json{width:100%;min-height:120px;border:1px solid var(--rule);border-radius:4px;
  background:var(--sheet-2);padding:9px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  line-height:1.5;resize:vertical}
.big{font-family:"IBM Plex Mono",monospace;font-size:40px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-soft)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.center{text-align:center}
.gap{display:flex;flex-direction:column;gap:10px}
.gap-s{display:flex;flex-direction:column;gap:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
hr.rule{border:none;border-top:1px solid var(--rule);margin:14px 0}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function(){
"use strict";
if(!window.React || !window.ReactDOM){
  document.getElementById('root').innerHTML =
    '<div style="padding:24px;font-family:system-ui;line-height:1.7">' +
    '<b>元件庫載入失敗</b><br>請檢查網路連線後重新整理頁面。</div>';
  return;
}
try {
/* ══════════════════════════════════════════════════════════════════════
   數學排版：把受限的 TeX 子集直接排成 HTML（不使用外部字型檔）
   支援：\frac \dfrac \sqrt \overline \text{} \operatorname{} 上下標
        希臘字母與運算符號、分組 {}、\left \right
   ══════════════════════════════════════════════════════════════════════ */
var h = React.createElement;

var SYM = {
  pi:'π', theta:'θ', alpha:'α', beta:'β', gamma:'γ',
  Delta:'Δ', times:'×', div:'÷', pm:'±', mp:'∓',
  cdot:'·', le:'≤', leq:'≤', ge:'≥', geq:'≥',
  ne:'≠', neq:'≠', approx:'≈', circ:'°',
  angle:'∠', triangle:'△', parallel:'∥', perp:'⊥',
  sim:'∽', cong:'≅', odot:'⊙', square:'□',
  Rightarrow:'⇒', rightarrow:'→', to:'→', leftrightarrow:'↔',
  Leftrightarrow:'⇔', iff:'⇔', checkmark:'✓',
  ldots:'…', cdots:'⋯', infty:'∞', sum:'∑',
  cup:'∪', cap:'∩', in:'∈', neg:'¬', prime:'′'
};
var SYM_TEXT = {
  'π':'pi','×':'乘','÷':'除以','±':'正負','≤':'小於等於',
  '≥':'大於等於','≠':'不等於','≈':'約等於','°':'度',
  '∠':'角','△':'三角形','∥':'平行','⊥':'垂直','∽':'相似於',
  '≅':'全等於','⇒':'則','⇔':'等價於','→':'到','∑':'總和','·':'乘','✓':'正確',
  '=':'等於','+':'加','-':'減','<':'小於','>':'大於',':':'比',
  '(':'左括號',')':'右括號','|':'絕對值','%':'百分比'
};
var FNS = {gcd:'gcd', lcm:'lcm', max:'max', min:'min', log:'log'};
var RELS = '=≤≥≠≈<>∥⊥∽≅⇒⇔→↔:';
var BINS = '+×÷±∓·';

function tokenize(src){
  var t = [], i = 0, n = src.length;
  while(i < n){
    var c = src[i];
    if(c === '\\'){
      var raw = /^\\(text|operatorname|mathrm)\{/.exec(src.slice(i));
      if(raw){
        var j = i + raw[0].length, depth = 1, buf = '';
        while(j < n && depth > 0){
          if(src[j] === '{') depth++;
          else if(src[j] === '}'){ depth--; if(!depth) break; }
          buf += src[j]; j++;
        }
        t.push({t: raw[1] === 'text' ? 'text' : 'fnname', v: buf});
        i = j + 1; continue;
      }
      var m = /^\\([a-zA-Z]+)/.exec(src.slice(i));
      if(m){ t.push({t:'cmd', v:m[1]}); i += m[0].length; }
      else { t.push({t:'chr', v:src[i+1] || ''}); i += 2; }
    }
    else if(c === '{'){ t.push({t:'{'}); i++; }
    else if(c === '}'){ t.push({t:'}'}); i++; }
    else if(c === '^'){ t.push({t:'^'}); i++; }
    else if(c === '_'){ t.push({t:'_'}); i++; }
    else if(c === ' '){ i++; }
    else if(c >= '0' && c <= '9'){
      var mm = /^[0-9]+(\.[0-9]+)?/.exec(src.slice(i));
      t.push({t:'num', v:mm[0]}); i += mm[0].length;
    }
    else { t.push({t:'chr', v:c}); i++; }
  }
  return t;
}

function parseSeq(ts, i, stopAtClose){
  var out = [];
  while(i < ts.length){
    if(ts[i].t === '}'){ if(stopAtClose) return [out, i+1]; i++; continue; }
    var r = parseUnit(ts, i);
    if(r[0]) out.push(r[0]);
    if(r[1] === i) i++; else i = r[1];
  }
  return [out, i];
}

function parseArg(ts, i){
  if(!ts[i]) return [{k:'seq', c:[]}, i];
  if(ts[i].t === '{'){ var r = parseSeq(ts, i+1, true); return [{k:'seq', c:r[0]}, r[1]]; }
  var a = parseAtom(ts, i);
  return [{k:'seq', c: a[0] ? [a[0]] : []}, a[1]];
}

function parseAtom(ts, i){
  var tk = ts[i];
  if(!tk) return [null, i];
  if(tk.t === '{'){ var r = parseSeq(ts, i+1, true); return [{k:'seq', c:r[0]}, r[1]]; }
  if(tk.t === 'text') return [{k:'text', v:tk.v}, i+1];
  if(tk.t === 'fnname') return [{k:'fn', v:tk.v}, i+1];
  if(tk.t === 'num') return [{k:'num', v:tk.v}, i+1];
  if(tk.t === 'cmd'){
    var c = tk.v;
    if(c === 'frac' || c === 'dfrac'){
      var a = parseArg(ts, i+1), b = parseArg(ts, a[1]);
      return [{k:'frac', n:a[0], d:b[0], big:(c === 'dfrac')}, b[1]];
    }
    if(c === 'sqrt'){ var s = parseArg(ts, i+1); return [{k:'sqrt', c:s[0]}, s[1]]; }
    if(c === 'overline' || c === 'bar'){ var o = parseArg(ts, i+1); return [{k:'ovl', c:o[0]}, o[1]]; }
    if(c === 'left' || c === 'right' || c === 'displaystyle') return [null, i+1];
    if(c === 'quad') return [{k:'sp', v:' '}, i+1];
    if(c === ',' ) return [{k:'sp', v:' '}, i+1];
    if(SYM[c]) return [{k:'sym', v:SYM[c]}, i+1];
    if(FNS[c]) return [{k:'fn', v:FNS[c]}, i+1];
    return [{k:'chr', v:c}, i+1];
  }
  if(tk.t === 'chr') return [{k:'chr', v:tk.v}, i+1];
  return [null, i+1];
}

function parseUnit(ts, i){
  var a = parseAtom(ts, i);
  var node = a[0]; i = a[1];
  var sup = null, sub = null, guard = 0;
  while(i < ts.length && (ts[i].t === '^' || ts[i].t === '_') && guard++ < 4){
    var kind = ts[i].t;
    var arg = parseArg(ts, i+1);
    if(kind === '^') sup = arg[0]; else sub = arg[0];
    i = arg[1];
  }
  if(sup || sub) node = {k:'script', base:node, sup:sup, sub:sub};
  return [node, i];
}

function parse(src){ return parseSeq(tokenize(String(src)), 0, false)[0]; }

/* ── 繪製 ─────────────────────────────────────────────────────────── */
function isOpenish(node){
  if(!node) return true;
  if(node.k === 'chr') return RELS.indexOf(node.v) >= 0 || BINS.indexOf(node.v) >= 0 || node.v === '(' || node.v === '[';
  if(node.k === 'sym') return RELS.indexOf(node.v) >= 0 || BINS.indexOf(node.v) >= 0;
  return false;
}

function renderSeq(nodes, keyPrefix){
  var out = [];
  for(var i = 0; i < nodes.length; i++){
    out.push(renderNode(nodes[i], keyPrefix + '-' + i, nodes[i-1]));
  }
  return out;
}

function renderNode(node, key, prev){
  if(!node) return null;
  switch(node.k){
    case 'seq': return h('span', {key:key}, renderSeq(node.c, key));
    case 'num': return h('span', {key:key, className:'n'}, node.v);
    case 'text': return h('span', {key:key, className:'tx'}, node.v);
    case 'fn': return h('span', {key:key, className:'fn'}, node.v);
    case 'sp': return h('span', {key:key}, node.v);
    case 'sym':
      if(RELS.indexOf(node.v) >= 0) return h('span', {key:key, className:'rel'}, node.v);
      if(BINS.indexOf(node.v) >= 0) return h('span', {key:key, className:'op'}, node.v);
      return h('span', {key:key}, node.v);
    case 'chr':
      var v = node.v;
      if(v === '-'){
        return isOpenish(prev)
          ? h('span', {key:key}, '−')
          : h('span', {key:key, className:'op'}, '−');
      }
      if(RELS.indexOf(v) >= 0) return h('span', {key:key, className:'rel'}, v);
      if(BINS.indexOf(v) >= 0) return h('span', {key:key, className:'op'}, v);
      if(/[a-zA-Z]/.test(v)) return h('span', {key:key, className:'v'}, v);
      return h('span', {key:key}, v);
    case 'ovl':
      return h('span', {key:key, className:'ovl'}, renderNode(node.c, key + 'o'));
    case 'frac':
      return h('span', {key:key, className:'frac' + (node.big ? ' dfrac' : '')},
        h('span', {className:'num2'}, renderNode(node.n, key + 'n')),
        h('span', {className:'den'}, renderNode(node.d, key + 'd')));
    case 'sqrt':
      return h('span', {key:key, className:'sqrt'},
        h('span', {className:'sign'}, '√'),
        h('span', {className:'cand'}, renderNode(node.c, key + 'r')));
    case 'script':
      return h('span', {key:key, className:'sc'},
        renderNode(node.base, key + 'b', prev),
        node.sub ? h('span', {className:'sub'}, renderNode(node.sub, key + 'sb')) : null,
        node.sup ? h('span', {className:'sup'}, renderNode(node.sup, key + 'sp')) : null);
    default: return null;
  }
}

/* ── 給螢幕閱讀器的口語化文字 ─────────────────────────────────────── */
function speak(nodes){
  var s = '';
  for(var i = 0; i < nodes.length; i++){
    var nd = nodes[i];
    if(!nd) continue;
    switch(nd.k){
      case 'seq': s += speak(nd.c); break;
      case 'num': s += nd.v; break;
      case 'text': s += nd.v; break;
      case 'fn': s += ' ' + nd.v + ' '; break;
      case 'sp': s += ' '; break;
      case 'sym': case 'chr':
        s += SYM_TEXT[nd.v] ? ' ' + SYM_TEXT[nd.v] + ' ' : nd.v; break;
      case 'ovl': s += '線段' + speak([nd.c]); break;
      case 'frac': s += '（' + speak([nd.d]) + ' 分之 ' + speak([nd.n]) + '）'; break;
      case 'sqrt': s += ' 根號（' + speak([nd.c]) + '）'; break;
      case 'script':
        s += speak([nd.base]);
        if(nd.sub) s += ' 下標 ' + speak([nd.sub]);
        if(nd.sup){
          var e = speak([nd.sup]).trim();
          s += (e === '2') ? ' 平方' : (e === '3') ? ' 立方' : ' 的 ' + e + ' 次方';
        }
        break;
    }
  }
  return s;
}

var _memo = {};
function parseMemo(src){
  if(!(src in _memo)) _memo[src] = parse(src);
  return _memo[src];
}

/* 行內公式 */
function M(props){
  var src = props.t == null ? '' : String(props.t);
  var nodes;
  try { nodes = parseMemo(src); }
  catch(e){ return h('span', {className:'m'}, src); }
  return h('span', {className:'m' + (props.block ? ' blk' : '') + (props.cls ? ' ' + props.cls : ''),
                    role:'math'},
    h('span', {'aria-hidden':'true'}, renderSeq(nodes, 'm')),
    h('span', {className:'sr'}, speak(nodes)));
}
/* 展示型公式（置中、可橫向捲動） */
function MB(props){ return h('div', {className:'mwrap'}, M({t:props.t, block:true, cls:props.cls})); }
/* ══════════════════════════════════════════════════════════════════════
   可重複使用的響應式 SVG 圖形元件
   每個元件皆接受 {data, highlight, reveal}
   highlight：提示第二級時標亮指定的邊、角、弧或對稱軸
   reveal   ：解析狀態才顯示的關鍵標籤
   ══════════════════════════════════════════════════════════════════════ */
function rad(d){ return d * Math.PI / 180; }
function polar(cx, cy, r, deg){ return [cx + r * Math.cos(rad(deg)), cy - r * Math.sin(rad(deg))]; }
function fx(n){ return Math.round(n * 10) / 10; }
function unit(P, Q){ var dx = Q[0]-P[0], dy = Q[1]-P[1], L = Math.hypot(dx, dy) || 1; return [dx/L, dy/L]; }
function midp(P, Q){ return [(P[0]+Q[0])/2, (P[1]+Q[1])/2]; }
function angOf(V, P){ return Math.atan2(V[1]-P[1], P[0]-V[0]) * 180 / Math.PI; }
function norm180(d){ while(d > 180) d -= 360; while(d < -180) d += 360; return d; }

function arcPath(cx, cy, r, a1, a2){
  var p1 = polar(cx, cy, r, a1), p2 = polar(cx, cy, r, a2);
  var large = Math.abs(a2 - a1) > 180 ? 1 : 0;
  var sweep = a2 > a1 ? 0 : 1;
  return 'M' + fx(p1[0]) + ' ' + fx(p1[1]) + ' A' + r + ' ' + r + ' 0 ' + large + ' ' + sweep +
         ' ' + fx(p2[0]) + ' ' + fx(p2[1]);
}
function angleArc(V, P1, P2, r, cls, key){
  var a1 = angOf(V, P1), d = norm180(angOf(V, P2) - a1);
  return h('path', {key:key, d:arcPath(V[0], V[1], r, a1, a1 + d), className:cls || 'thin'});
}
function angleLabelAt(V, P1, P2, r){
  var a1 = angOf(V, P1), d = norm180(angOf(V, P2) - a1);
  return polar(V[0], V[1], r, a1 + d / 2);
}
function AL(V, P1, P2, r, txt, cls, key){
  var p = angleLabelAt(V, P1, P2, r);
  return h('text', {key:key, x:fx(p[0]), y:fx(p[1]) + 4, className:cls || 'sm', textAnchor:'middle'}, txt);
}
function ticks(P, Q, n, key, cls){
  var m = midp(P, Q), u = unit(P, Q), px = -u[1], py = u[0], out = [];
  for(var i = 0; i < n; i++){
    var off = (i - (n - 1) / 2) * 4.5;
    var bx = m[0] + u[0] * off, by = m[1] + u[1] * off;
    out.push(h('line', {key:key + i, x1:fx(bx - px*5), y1:fx(by - py*5),
      x2:fx(bx + px*5), y2:fx(by + py*5), className:cls || 'thin'}));
  }
  return out;
}
function chevrons(P, Q, n, key){
  var m = midp(P, Q), u = unit(P, Q), px = -u[1], py = u[0], out = [];
  for(var i = 0; i < n; i++){
    var off = (i - (n - 1) / 2) * 6;
    var bx = m[0] + u[0] * off, by = m[1] + u[1] * off;
    out.push(h('path', {key:key + i, className:'thin',
      d:'M' + fx(bx - u[0]*4 + px*4) + ' ' + fx(by - u[1]*4 + py*4) +
        ' L' + fx(bx + u[0]*3) + ' ' + fx(by + u[1]*3) +
        ' L' + fx(bx - u[0]*4 - px*4) + ' ' + fx(by - u[1]*4 - py*4)}));
  }
  return out;
}
function rightAngle(V, P1, P2, s, key, cls){
  s = s || 11;
  var u1 = unit(V, P1), u2 = unit(V, P2);
  var a = [V[0] + u1[0]*s, V[1] + u1[1]*s], b = [V[0] + u2[0]*s, V[1] + u2[1]*s];
  var c = [a[0] + u2[0]*s, a[1] + u2[1]*s];
  return h('path', {key:key || 'ra', className:cls || 'thin',
    d:'M' + fx(a[0]) + ' ' + fx(a[1]) + ' L' + fx(c[0]) + ' ' + fx(c[1]) +
      ' L' + fx(b[0]) + ' ' + fx(b[1])});
}
function seg(P, Q, cls, key){
  return h('line', {key:key, x1:fx(P[0]), y1:fx(P[1]), x2:fx(Q[0]), y2:fx(Q[1]), className:cls || 'stk'});
}
function poly(pts, cls, key){
  return h('polygon', {key:key, className:cls || 'stk',
    points:pts.map(function(p){ return fx(p[0]) + ',' + fx(p[1]); }).join(' ')});
}
function T(x, y, txt, cls, anchor, key){
  return h('text', {key:key || ('t' + fx(x) + '_' + fx(y) + '_' + String(txt).slice(0, 8)),
    x:fx(x), y:fx(y), className:cls || '', textAnchor:anchor || 'middle'}, txt);
}
/* 圖例：線型樣本 + 文字，用於避免標籤互相重疊 */
function legend(x, y, rows, key){
  var w = 0;
  rows.forEach(function(r){ w = Math.max(w, 30 + r.label.length * 8); });
  var out = [h('rect', {key:(key || 'lg') + 'bg', x:x - 6, y:y - 11, width:w + 10,
    height:rows.length * 16 + 6, rx:3,
    style:{fill:'var(--sheet)', fillOpacity:.9, stroke:'var(--rule)', strokeWidth:1}})];
  rows.forEach(function(r, i){
    var yy = y + i * 16;
    out.push(h('line', {key:(key || 'lg') + 's' + i, x1:x, y1:yy, x2:x + 20, y2:yy, className:r.cls}));
    out.push(h('text', {key:(key || 'lg') + 't' + i, x:x + 25, y:yy + 4,
      className:'sm', textAnchor:'start'}, r.label));
  });
  return out;
}
function VL(P, txt, dx, dy, key){  /* 頂點字母 */
  return h('text', {key:key || ('v' + txt), x:fx(P[0] + dx), y:fx(P[1] + dy),
    className:'lbl', textAnchor:'middle'}, txt);
}
function dot(P, cls, key, r){
  return h('circle', {key:key, cx:fx(P[0]), cy:fx(P[1]), r:r || 3, className:cls || 'dot'});
}

function Fig(props){
  return h('div', {className:'gap-s'},
    h('div', {className:'figure'},
      h('svg', {viewBox:props.vb || '0 0 300 200', role:'img',
        'aria-label':(props.title || '') + '。' + (props.desc || '')},
        h('title', null, props.title || ''),
        h('desc', null, props.desc || ''),
        props.children)),
    props.caption ? h('div', {className:'figcap'}, props.caption) : null);
}

/* ── 1. 三角形（內角／外角／中位線／高／邊角關係）──────────────────── */
function TriangleDiagram(p){
  var d = p.data || {}, v = d.variant || 'angles', HL = p.highlight, RV = p.reveal;
  var A = [150, 32], B = [46, 168], C = [262, 168];
  var kids = [], cap = '', title = '三角形', desc = '';
  if(v === 'angles' || v === 'exterior'){
    var D = [300, 168];
    kids.push(seg(C, D, 'dash', 'ext'));
    kids.push(poly([A, B, C], 'stk', 'tri'));
    kids.push(angleArc(A, B, C, 21, HL ? 'hl' : 'thin', 'aA'));
    kids.push(angleArc(B, C, A, 21, HL ? 'hl' : 'thin', 'aB'));
    kids.push(angleArc(C, A, B, 21, 'thin', 'aC'));
    kids.push(angleArc(C, A, D, 17, v === 'exterior' ? 'hl' : 'thin', 'aE'));
    kids.push(AL(A, B, C, 33, '∠A', 'sm', 'lA'));
    kids.push(AL(B, C, A, 33, '∠B', 'sm', 'lB'));
    kids.push(AL(C, A, B, 34, '∠C', 'sm', 'lC'));
    kids.push(AL(C, A, D, 30, v === 'exterior' ? '∠1' : '∠1', 'acc', 'lE'));
    kids.push(VL(A, 'A', 0, -10), VL(B, 'B', -11, 6), VL(C, 'C', -6, 17), VL(D, 'D', 8, 6));
    if(RV) kids.push(T(150, 118, v === 'exterior' ? '∠1 = ∠A + ∠B' : '∠A+∠B+∠C = 180°', 'acc'));
    title = v === 'exterior' ? '三角形的外角' : '三角形的內角';
    desc = '三角形 ABC，底邊 BC 向右延長到 D。∠A、∠B、∠C 為內角，∠1 為頂點 C 的外角。';
    cap = v === 'exterior' ? '∠1 是 C 的外角，兩個不相鄰內角是 ∠A 與 ∠B' : '三個內角 ∠A、∠B、∠C；虛線延長線外側的 ∠1 是外角';
  }
  else if(v === 'midsegment'){
    var M = midp(A, B), N = midp(A, C);
    kids.push(poly([A, B, C], 'stk', 'tri'));
    kids.push(seg(M, N, HL ? 'hl' : 'stk', 'mn'));
    kids.push.apply(kids, ticks(A, M, 1, 'tAM'));
    kids.push.apply(kids, ticks(M, B, 1, 'tMB'));
    kids.push.apply(kids, ticks(A, N, 2, 'tAN'));
    kids.push.apply(kids, ticks(N, C, 2, 'tNC'));
    kids.push.apply(kids, chevrons(M, N, 1, 'cMN'));
    kids.push.apply(kids, chevrons(B, C, 1, 'cBC'));
    kids.push(VL(A, 'A', 0, -10), VL(B, 'B', -11, 6), VL(C, 'C', 11, 6),
              VL(M, 'M', -13, 2), VL(N, 'N', 13, 2));
    if(RV) kids.push(T(150, 128, 'MN ∥ BC，MN = ½ BC', 'acc'));
    title = '三角形中位線';
    desc = 'M、N 分別是 AB、AC 的中點，線段 MN 與底邊 BC 平行，長度是 BC 的一半。相同記號代表等長，箭頭記號代表平行。';
    cap = '同記號＝等長，箭頭＝平行';
  }
  else if(v === 'area'){
    var H = [150, 168];
    kids.push(poly([A, B, C], 'stk', 'tri'));
    kids.push(seg(A, H, HL ? 'hl' : 'dash', 'ht'));
    kids.push(rightAngle(H, C, A, 10, 'raH'));
    kids.push(T(150, 186, '底', 'acc'), T(163, 105, '高', 'acc', 'start'));
    kids.push(VL(A, 'A', 0, -10), VL(B, 'B', -11, 6), VL(C, 'C', 11, 6));
    title = '三角形的底與高';
    desc = '三角形 ABC 以 BC 為底，從頂點 A 向 BC 作垂線得到高，垂足處有直角記號。';
    cap = '高一定要垂直於所取的底';
  }

/* ── 3. 全等判定 ───────────────────────────────────────────────────── */
function CongruenceDiagram(p){
  var d = p.data || {}, v = (d.variant || 'SSS').toUpperCase(), HL = p.highlight, RV = p.reveal;
  var kids = [];
  if(v === 'RHS'){
    var A = [42, 28], B = [42, 148], C = [122, 148];
    var D = [212, 28], E = [212, 148], F = [292, 148];
    kids.push(poly([A, B, C], 'stk', 't1'), poly([D, E, F], 'stk', 't2'));
    kids.push(rightAngle(B, A, C, 12, 'r1'), rightAngle(E, D, F, 12, 'r2'));
    kids.push.apply(kids, ticks(A, C, 1, 'h1', HL ? 'hl' : 'thin'));
    kids.push.apply(kids, ticks(D, F, 1, 'h2', HL ? 'hl' : 'thin'));
    kids.push.apply(kids, ticks(B, C, 2, 's1', HL ? 'hl' : 'thin'));
    kids.push.apply(kids, ticks(E, F, 2, 's2', HL ? 'hl' : 'thin'));
    kids.push(VL(A, 'A', -11, 2), VL(B, 'B', -11, 6), VL(C, 'C', 8, 14),
              VL(D, 'D', -11, 2), VL(E, 'E', -11, 6), VL(F, 'F', 8, 14));
    kids.push(T(150, 96, '≅', 'acc'));
    if(RV) kids.push(T(150, 178, '直角＋斜邊＋一股 ⇒ △ABC ≅ △DEF', 'acc'));
    return h(Fig, {vb:'0 0 305 190', title:'RHS 全等判定',
      desc:'兩個直角三角形，直角在 B 與 E；斜邊 AC 與 DF 等長（單記號），一股 BC 與 EF 等長（雙記號）。',
      caption:'RHS：直角、斜邊、一股'}, kids);
  }
  var A1 = [40, 30], B1 = [16, 150], C1 = [126, 150];
  var A2 = [216, 30], B2 = [192, 150], C2 = [302, 150];
  kids.push(poly([A1, B1, C1], 'stk', 't1'), poly([A2, B2, C2], 'stk', 't2'));
  var side = function(P, Q, R, S, n, k){
    kids.push.apply(kids, ticks(P, Q, n, k + 'a', HL ? 'hl' : 'thin'));
    kids.push.apply(kids, ticks(R, S, n, k + 'b', HL ? 'hl' : 'thin'));
  };
  var ang2 = function(V1, X1, Y1, V2, X2, Y2, r, k){
    kids.push(angleArc(V1, X1, Y1, r, HL ? 'hl' : 'thin', k + 'a'));
    kids.push(angleArc(V2, X2, Y2, r, HL ? 'hl' : 'thin', k + 'b'));
  };
  if(v === 'SSS'){
    side(A1, B1, A2, B2, 1, 'u'); side(B1, C1, B2, C2, 2, 'w'); side(A1, C1, A2, C2, 3, 'z');
  } else if(v === 'SAS'){
    side(A1, B1, A2, B2, 1, 'u'); side(A1, C1, A2, C2, 2, 'z');
    ang2(A1, B1, C1, A2, B2, C2, 18, 'g');
  } else if(v === 'ASA'){
    side(B1, C1, B2, C2, 1, 'w');
    ang2(B1, A1, C1, B2, A2, C2, 18, 'g'); ang2(C1, A1, B1, C2, A2, B2, 22, 'g2');
  } else {  /* AAS */
    side(A1, C1, A2, C2, 1, 'z');
    ang2(A1, B1, C1, A2, B2, C2, 18, 'g'); ang2(B1, A1, C1, B2, A2, C2, 22, 'g2');
  }
  kids.push(VL(A1, 'A', 0, -9), VL(B1, 'B', -11, 6), VL(C1, 'C', 10, 12),
            VL(A2, 'D', 0, -9), VL(B2, 'E', -11, 6), VL(C2, 'F', 10, 12));
  kids.push(T(160, 96, '≅', 'acc'));
  if(RV) kids.push(T(160, 182, v + ' ⇒ △ABC ≅ △DEF', 'acc'));
  var descs = {SSS:'三組對應邊分別等長（一、二、三道記號）。',
    SAS:'兩組對應邊等長，且它們夾的角相等。',
    ASA:'兩組對應角相等，且它們夾的邊 BC 與 EF 等長。',
    AAS:'兩組對應角相等，加上一組非夾邊 AC 與 DF 等長。'};
  return h(Fig, {vb:'0 0 320 190', title:v + ' 全等判定',
    desc:'左右兩個三角形 ABC 與 DEF。' + descs[v],
    caption:v + '：相同記號代表對應相等'}, kids);
}

    desc = '直角在 B 的三角形，外心 O 正好落在斜邊 AC 的中點上，外接圓以 AC 為直徑。';
    cap = '直角三角形的外心在斜邊中點，斜邊就是直徑';
  } else if(v === 'incenter'){
    var I = [143.8, 100.8], r = 35.7;
    var tAB = [110.2, 88.6], tBC = [146.9, 136.4], tAC = [171.1, 77.8];
    kids.push(h('circle', {key:'ic', cx:143.8, cy:100.8, r:35.7, className:HL ? 'hl' : 'fillT'}));
    kids.push(seg(A, I, 'thin', 'b1'), seg(B, I, 'thin', 'b2'), seg(C, I, 'thin', 'b3'));
    kids.push(seg(I, tAB, HL ? 'hl' : 'dash', 'd1'), seg(I, tBC, HL ? 'hl' : 'dash', 'd2'),
              seg(I, tAC, HL ? 'hl' : 'dash', 'd3'));
    kids.push(rightAngle(tAB, A, I, 7, 'r1'), rightAngle(tBC, B, I, 7, 'r2'), rightAngle(tAC, A, I, 7, 'r3'));
    kids.push(angleArc(A, B, I, 15, 'thin', 'g1'), angleArc(A, I, C, 15, 'thin', 'g2'));
    kids.push(dot(I, 'dotT', 'i', 3.4), T(I[0] + 7, I[1] + 13, 'I', 'lbl', 'start'));
    kids.push(T(I[0] - 18, I[1] - 4, '半徑', 'acc', 'end'));
    if(RV) kids.push(T(150, 192, 'I 到三邊等距＝內切圓半徑', 'acc'));
    title = '內心與內切圓';
    desc = '三角形三個內角平分線交於一點 I，I 到三邊的距離都等於內切圓半徑。';
    cap = '內心＝三條角平分線的交點，到三邊等距';
  } else if(v === 'centroid-areas'){
    var G0 = [145.9, 100.7];
    kids.push(seg(A, mBC, 'thin', 'm1'), seg(B, mAC, 'thin', 'm2'), seg(C, mAB, 'thin', 'm3'));
    kids.push(seg(G0, A, HL ? 'hl' : 'thin', 'x1'), seg(G0, B, HL ? 'hl' : 'thin', 'x2'),
              seg(G0, C, HL ? 'hl' : 'thin', 'x3'));
    kids.push(dot(G0, 'dotT', 'g', 3.4), T(G0[0] + 8, G0[1] + 13, 'G', 'lbl', 'start'));
    [[A, mAB, G0], [mAB, B, G0], [B, mBC, G0], [mBC, C, G0], [C, mAC, G0], [mAC, A, G0]]
      .forEach(function(tri, i){
        var cxy = [(tri[0][0] + tri[1][0] + tri[2][0]) / 3, (tri[0][1] + tri[1][1] + tri[2][1]) / 3];
        kids.push(T(cxy[0], cxy[1] + 4, String(i + 1), 'sm', 'middle', 'z' + i));
      });
    if(RV) kids.push(T(150, 192, '六塊面積都相等，各為 ⅙', 'acc'));
    title = '三條中線分出的六塊';
    desc = '三條中線把三角形分成六個小三角形，六塊的面積完全相等。';
    cap = '① ~ ⑥ 六塊面積相等';
  } else {  /* centroid */
    var G = [145.9, 100.7];
    kids.push(seg(A, mBC, HL ? 'hl' : 'thin', 'm1'), seg(B, mAC, 'thin', 'm2'), seg(C, mAB, 'thin', 'm3'));
    kids.push.apply(kids, ticks(B, mBC, 1, 'k1')); kids.push.apply(kids, ticks(mBC, C, 1, 'k2'));
    kids.push.apply(kids, ticks(A, mAC, 2, 'k3')); kids.push.apply(kids, ticks(mAC, C, 2, 'k4'));
    kids.push.apply(kids, ticks(A, mAB, 3, 'k5')); kids.push.apply(kids, ticks(mAB, B, 3, 'k6'));
    kids.push(dot(G, 'dotT', 'g', 3.4), T(G[0] + 9, G[1] - 4, 'G', 'lbl', 'start'));
    if(RV) kids.push(T(138.6, 69, '2', 'acc', 'middle'), T(149.6, 122, '1', 'acc', 'middle'));
    if(RV) kids.push(T(150, 192, 'AG : G(BC中點) = 2 : 1', 'acc'));
    title = '重心與三條中線';
    desc = '三角形三條中線交於重心 G，頂點到重心的長度是重心到對邊中點的兩倍。';
    cap = '重心把每條中線分成 2 : 1（靠頂點那段較長）';
  }
  return h(Fig, {vb:'0 0 300 200', title:title, desc:desc, caption:cap}, kids);
}

/* ── 7. 四邊形 ─────────────────────────────────────────────────────── */
function QuadrilateralDiagram(p){
  var d = p.data || {}, v = d.variant || 'parallelogram', HL = p.highlight, RV = p.reveal;
  var kids = [], title, desc, cap, pts, note = '';
  if(v === 'parallelogram' || v === 'rectangle'){
    pts = v === 'rectangle' ? [[52, 46], [248, 46], [248, 152], [52, 152]]
                            : [[38, 152], [96, 46], [262, 46], [204, 152]];
    var A = pts[3], B = pts[0], C = pts[1], D = pts[2];
    var Aa = pts[0], Bb = pts[1], Cc = pts[2], Dd = pts[3];
    kids.push(poly(pts, 'stk', 'q'));
    kids.push(seg(Aa, Cc, HL ? 'hl' : 'dash', 'd1'), seg(Bb, Dd, HL ? 'hl' : 'dash', 'd2'));
    var O = midp(Aa, Cc);
    kids.push(dot(O, 'dotT', 'o', 3));
    kids.push.apply(kids, ticks(Aa, O, 1, 'x1')); kids.push.apply(kids, ticks(O, Cc, 1, 'x2'));
    kids.push.apply(kids, ticks(Bb, O, 2, 'x3')); kids.push.apply(kids, ticks(O, Dd, 2, 'x4'));
    kids.push.apply(kids, chevrons(Aa, Bb, 1, 'c1')); kids.push.apply(kids, chevrons(Dd, Cc, 1, 'c2'));
    kids.push.apply(kids, chevrons(Bb, Cc, 2, 'c3')); kids.push.apply(kids, chevrons(Aa, Dd, 2, 'c4'));
    kids.push(VL(Aa, 'A', -11, 8), VL(Bb, 'B', -6, -8), VL(Cc, 'C', 10, -8), VL(Dd, 'D', 11, 8));
    if(v === 'rectangle'){
      kids.push(rightAngle(Aa, Bb, Dd, 11, 'ra1'), rightAngle(Cc, Bb, Dd, 11, 'ra2'));
      if(RV) kids.push(T(150, 180, '長方形：AC = BD，且互相平分', 'acc'));
      title = '長方形的對角線'; cap = '長方形的兩條對角線等長，而且互相平分';
      desc = '長方形 ABCD 的兩條對角線交於中點 O，兩條對角線長度相等並互相平分。';
    } else {
      if(RV) kids.push(T(150, 180, '對邊平行且相等，對角線互相平分', 'acc'));
      title = '平行四邊形'; cap = '箭頭＝平行；對角線在 O 互相平分';
      desc = '平行四邊形 ABCD，兩組對邊分別平行且相等，對角線交於 O 並互相平分。';
    }
  } else if(v === 'rhombus'){
    pts = [[150, 36], [252, 100], [150, 164], [48, 100]];
    var O2 = [150, 100];
    kids.push(poly(pts, 'stk', 'q'));
    kids.push(seg(pts[0], pts[2], HL ? 'hl' : 'dash', 'd1'), seg(pts[1], pts[3], HL ? 'hl' : 'dash', 'd2'));
    kids.push(rightAngle(O2, pts[0], pts[1], 11, 'ra'));
    kids.push(dot(O2, 'dotT', 'o', 3));
    [[0, 1], [1, 2], [2, 3], [3, 0]].forEach(function(e, i){
      kids.push.apply(kids, ticks(pts[e[0]], pts[e[1]], 1, 'e' + i));
    });
    kids.push.apply(kids, ticks(pts[0], O2, 2, 'g1')); kids.push.apply(kids, ticks(O2, pts[2], 2, 'g2'));
    kids.push(VL(pts[0], 'A', 0, -9), VL(pts[1], 'B', 11, 4), VL(pts[2], 'C', 0, 16), VL(pts[3], 'D', -11, 4));
    if(RV) kids.push(T(150, 188, '菱形：對角線互相垂直平分', 'acc'));
    title = '菱形的對角線'; cap = '四邊等長；對角線互相垂直平分（直角記號）';
    desc = '菱形 ABCD 四邊等長，兩條對角線互相垂直並且互相平分。';
  } else if(v === 'kite'){
    pts = [[150, 22], [228, 84], [150, 172], [72, 84]];
    var O3 = [150, 84];
    kids.push(poly(pts, 'stk', 'q'));
    kids.push(seg(pts[0], pts[2], HL ? 'hl' : 'dash', 'd1'), seg(pts[1], pts[3], 'dash', 'd2'));
    kids.push(rightAngle(O3, pts[0], pts[1], 10, 'ra'));
    kids.push.apply(kids, ticks(pts[0], pts[1], 1, 'e0')); kids.push.apply(kids, ticks(pts[0], pts[3], 1, 'e1'));
    kids.push.apply(kids, ticks(pts[2], pts[1], 2, 'e2')); kids.push.apply(kids, ticks(pts[2], pts[3], 2, 'e3'));
    kids.push.apply(kids, ticks(pts[3], O3, 3, 'g1')); kids.push.apply(kids, ticks(O3, pts[1], 3, 'g2'));
    kids.push(VL(pts[0], 'A', 0, -9), VL(pts[1], 'B', 11, 4), VL(pts[2], 'C', 13, 6), VL(pts[3], 'D', -11, 4));
    kids.push(T(138, 52, 'AO', 'sm', 'end'), T(138, 132, 'OC', 'sm', 'end'));
    if(RV) kids.push(T(150, 196, 'AC 垂直平分 BD；AO ≠ OC，BD 不平分 AC', 'acc'));
    title = '箏形'; cap = '只有一條對角線（AC）垂直平分另一條';
    desc = '箏形 ABCD，AB = AD、CB = CD，但 AB 與 CB 不等長。對角線 AC 垂直平分 BD，' +
           '而 AO 與 OC 不相等，所以 BD 並不平分 AC。';
  } else if(v === 'isotrapezoid'){
    pts = [[84, 46], [216, 46], [262, 152], [38, 152]];
    kids.push(poly(pts, 'stk', 'q'));
    kids.push.apply(kids, chevrons(pts[0], pts[1], 1, 'c1'));
    kids.push.apply(kids, chevrons(pts[3], pts[2], 1, 'c2'));
    kids.push.apply(kids, ticks(pts[0], pts[3], 1, 'e1')); kids.push.apply(kids, ticks(pts[1], pts[2], 1, 'e2'));
    kids.push(angleArc(pts[3], pts[0], pts[2], 20, HL ? 'hl' : 'thin', 'a1'));
    kids.push(angleArc(pts[2], pts[3], pts[1], 20, HL ? 'hl' : 'thin', 'a2'));
    kids.push(seg(pts[0], pts[2], 'dash', 'dg1'), seg(pts[1], pts[3], 'dash', 'dg2'));
    kids.push(VL(pts[0], 'A', -6, -8), VL(pts[1], 'B', 6, -8), VL(pts[2], 'C', 11, 8), VL(pts[3], 'D', -11, 8));
    if(RV) kids.push(T(150, 180, '∠D = ∠C，兩腰等長，對角線等長', 'acc'));
    title = '等腰梯形'; cap = '兩腰等長 ⇒ 同一底上的兩底角相等';
    desc = '等腰梯形 ABCD，AB 平行 DC，兩腰 AD 與 BC 等長，下底的兩個底角 ∠D 與 ∠C 相等。';
  } else if(v === 'parallelogram-area'){
    pts = [[38, 156], [96, 50], [262, 50], [204, 156]];
    var Hf = [96, 156];
    kids.push(poly(pts, 'stk', 'q'));
    kids.push(seg(pts[1], Hf, HL ? 'hl' : 'dash', 'hh'));
    kids.push(rightAngle(Hf, pts[3], pts[1], 10, 'ra'));
    kids.push.apply(kids, chevrons(pts[0], pts[1], 1, 'c1'));
    kids.push.apply(kids, chevrons(pts[3], pts[2], 1, 'c2'));
    kids.push(T(121, 174, '底', 'acc'), T(106, 106, '高', 'acc', 'start'));
    if(RV) kids.push(T(150, 34, '面積 = 底 × 高', 'acc'));
    title = '平行四邊形的底與高'; cap = '高必須垂直於底，不是斜邊';
    desc = '平行四邊形以下方那一邊為底，從上方頂點向底作垂線得到高，垂足有直角記號。';
  } else if(v === 'trapezoid-area'){
    pts = [[92, 50], [206, 50], [262, 156], [38, 156]];
    var Hf2 = [92, 156];
    kids.push(poly(pts, 'stk', 'q'));
    kids.push(seg(pts[0], Hf2, HL ? 'hl' : 'dash', 'hh'));
    kids.push(rightAngle(Hf2, pts[2], pts[0], 10, 'ra'));
    kids.push.apply(kids, chevrons(pts[0], pts[1], 1, 'c1'));
    kids.push.apply(kids, chevrons(pts[3], pts[2], 1, 'c2'));
    kids.push(T(149, 42, '上底', 'acc'), T(150, 174, '下底', 'acc'), T(102, 106, '高', 'acc', 'start'));
    if(RV) kids.push(T(150, 26, '面積 =（上底 ＋ 下底）× 高 ÷ 2', 'acc'));
    title = '梯形的兩底與高'; cap = '兩底是互相平行的那一組對邊';
    desc = '梯形的上底與下底互相平行（箭頭記號），兩底之間的垂直距離就是高。';
  } else if(v === 'polygon-angles' || v === 'regular-polygon'){
    var cen = [150, 106], Rp = 78, pn = [];
    for(var t = 0; t < 5; t++) pn.push(polar(cen[0], cen[1], Rp, 90 + t * 72));
    kids = [poly(pn, 'stk', 'p')];
    if(v === 'polygon-angles'){
      kids.push(seg(pn[0], pn[2], HL ? 'hl' : 'dash', 'd1'), seg(pn[0], pn[3], HL ? 'hl' : 'dash', 'd2'));
      [[0, 1, 2], [0, 2, 3], [0, 3, 4]].forEach(function(tr, i){
        var cxy = [(pn[tr[0]][0] + pn[tr[1]][0] + pn[tr[2]][0]) / 3,
                   (pn[tr[0]][1] + pn[tr[1]][1] + pn[tr[2]][1]) / 3];
        kids.push(T(cxy[0], cxy[1] + 4, String(i + 1), 'acc', 'middle', 'nn' + i));
      });
      if(RV) kids.push(T(150, 198, '5 邊形切出 5 − 2 = 3 個三角形 ⇒ 3 × 180° = 540°', 'acc'));
      title = '凸多邊形內角和'; cap = '從一個頂點拉對角線，n 邊形切出 (n − 2) 個三角形';
      desc = '一個凸五邊形，從同一個頂點拉出兩條對角線，把五邊形切成三個三角形。';
    } else {
      for(var q2 = 0; q2 < 5; q2++){
        kids.push(angleArc(pn[q2], pn[(q2 + 4) % 5], pn[(q2 + 1) % 5], 16, 'thin', 'ag' + q2));
      }
      kids.push.apply(kids, ticks(pn[0], pn[1], 1, 'e0'));
      kids.push.apply(kids, ticks(pn[1], pn[2], 1, 'e1'));
      kids.push.apply(kids, ticks(pn[2], pn[3], 1, 'e2'));
      kids.push.apply(kids, ticks(pn[3], pn[4], 1, 'e3'));
      kids.push.apply(kids, ticks(pn[4], pn[0], 1, 'e4'));
      kids.push(AL(pn[2], pn[1], pn[3], 30, RV ? '108°' : '?', 'acc', 'la'));
      if(RV) kids.push(T(150, 198, '正五邊形每個內角 = 540° ÷ 5 = 108°', 'acc'));
      title = '正多邊形的內角'; cap = '正多邊形每邊等長、每個內角也一樣大';
      desc = '正五邊形五邊等長（同記號）、五個內角相等，每個內角是內角和除以 5。';
    }
    return h(Fig, {vb:'0 0 300 205', title:title, desc:desc, caption:cap}, kids);
  } else {  /* trapezoid-mid：梯形中位線 */
    pts = [[84, 46], [216, 46], [262, 152], [38, 152]];
    var M = midp(pts[0], pts[3]), N = midp(pts[1], pts[2]);
    kids.push(poly(pts, 'stk', 'q'));
    kids.push(seg(M, N, HL ? 'hl' : 'stk', 'mn'));
    kids.push.apply(kids, ticks(pts[0], M, 1, 'k1')); kids.push.apply(kids, ticks(M, pts[3], 1, 'k2'));
    kids.push.apply(kids, ticks(pts[1], N, 2, 'k3')); kids.push.apply(kids, ticks(N, pts[2], 2, 'k4'));
    kids.push.apply(kids, chevrons(pts[0], pts[1], 1, 'c1'));
    kids.push.apply(kids, chevrons(M, N, 1, 'c2'));
    kids.push.apply(kids, chevrons(pts[3], pts[2], 1, 'c3'));
    kids.push(T(150, 40, '上底', 'sm'), T(150, 168, '下底', 'sm'), T(150, 94, '中位線', 'acc'));
    kids.push(VL(pts[0], 'A', -6, -10), VL(pts[1], 'B', 6, -10), VL(pts[2], 'C', 11, 8), VL(pts[3], 'D', -11, 8));
    if(RV) kids.push(T(150, 188, '中位線 =（上底 ＋ 下底）÷ 2', 'acc'));
    title = '梯形中位線'; cap = '中位線平行兩底，長度是兩底和的一半';
    desc = '梯形 ABCD，M、N 分別是兩腰的中點，中位線 MN 平行上下底，長度為兩底和的一半。';
  }
  return h(Fig, {vb:'0 0 300 200', title:title, desc:desc, caption:cap}, kids);
}

/* ── 8. 圓心角與圓周角 ─────────────────────────────────────────────── */
function CircleAngleDiagram(p){
  var d = p.data || {}, v = d.variant || 'central-inscribed', HL = p.highlight, RV = p.reveal;
  var O = [150, 102], R = 70;
  var at = function(deg){ return polar(O[0], O[1], R, deg); };
  var kids = [h('circle', {key:'c', cx:150, cy:102, r:R, className:'stk'})];
  var title, desc, cap;
  if(v === 'central-inscribed'){
    var A = at(200), B = at(340), P = at(90);
    kids.push(h('path', {key:'arc', className:HL ? 'hl' : 'thin',
      d:arcPath(O[0], O[1], R, 200, 340)}));
    kids.push(seg(O, A, 'stk', 'oa'), seg(O, B, 'stk', 'ob'));
    kids.push(seg(P, A, 'stk', 'pa'), seg(P, B, 'stk', 'pb'));
    kids.push(angleArc(O, A, B, 26, 'thin', 'ao'), angleArc(P, A, B, 30, 'thin', 'ap'));
    kids.push(AL(O, A, B, 38, RV ? '140°' : '?', 'acc', 'lo'));
    kids.push(AL(P, A, B, 42, RV ? '70°' : '?', 'acc2', 'lp'));
    kids.push(dot(O, 'dot', 'o', 2.6), VL(O, 'O', -10, 5), VL(P, 'P', 0, -9),
              VL(A, 'A', -11, 4), VL(B, 'B', 11, 4));
    if(RV) kids.push(T(150, 196, '圓心角 = 2 × 同弧圓周角', 'acc'));
    title = '圓心角與圓周角'; cap = '粗弧 AB 所對：圓心角 ∠AOB、圓周角 ∠APB';
    desc = '圓 O 上有 A、B 兩點，弧 AB 所對的圓心角為 ∠AOB，圓周上另一點 P 所對的圓周角為 ∠APB，圓心角是圓周角的兩倍。';
  } else if(v === 'same-arc'){
    var A2 = at(200), B2 = at(340), P1 = at(110), P2 = at(62);
    kids.push(h('path', {key:'arc', className:HL ? 'hl' : 'thin', d:arcPath(O[0], O[1], R, 200, 340)}));
    kids.push(seg(P1, A2, 'stk', 'a1'), seg(P1, B2, 'stk', 'b1'));
    kids.push(seg(P2, A2, 'dash', 'a2'), seg(P2, B2, 'dash', 'b2'));
    kids.push(angleArc(P1, A2, B2, 26, 'thin', 'g1'), angleArc(P2, A2, B2, 26, 'thin', 'g2'));
    kids.push(AL(P1, A2, B2, 38, '①', 'acc', 'l1'), AL(P2, A2, B2, 38, '②', 'acc', 'l2'));
    kids.push(VL(P1, 'P', -8, -7), VL(P2, 'Q', 8, -7), VL(A2, 'A', -11, 4), VL(B2, 'B', 11, 4));
    if(RV) kids.push(T(150, 196, '① = ②（同弧所對的圓周角相等）', 'acc'));
    title = '同弧圓周角'; cap = '不論 P 在弧上哪裡，同弧所對的圓周角都一樣大';
    desc = '弧 AB 所對的兩個圓周角 ∠APB 與 ∠AQB 相等。';
  } else if(v === 'diameter'){
    var A3 = [80, 102], B3 = [220, 102], P3 = at(120);
    kids.push(seg(A3, B3, HL ? 'hl' : 'stk', 'diam'));
    kids.push(seg(P3, A3, 'stk', 'pa'), seg(P3, B3, 'stk', 'pb'));
    kids.push(rightAngle(P3, A3, B3, 12, 'ra'));
    kids.push(AL(P3, A3, B3, 34, RV ? '90°' : '?', 'acc', 'lp'));
    kids.push(dot(O, 'dot', 'o', 2.6), VL(O, 'O', 0, 15), VL(P3, 'P', -4, -9),
              VL(A3, 'A', -11, 4), VL(B3, 'B', 11, 4));
    if(RV) kids.push(T(150, 196, 'AB 是直徑 ⇒ ∠APB = 90°', 'acc'));
    title = '直徑所對的圓周角'; cap = 'AB 通過圓心（直徑）時，∠APB 一定是直角';
    desc = 'AB 是圓 O 的直徑，P 在圓上，∠APB 為直角。';
  } else if(v === 'cyclic'){
    var A4 = at(150), B4 = at(215), C4 = at(330), D4 = at(40);
    kids.push(poly([A4, B4, C4, D4], 'stk', 'q'));

/* ── 座標格線共用 ──────────────────────────────────────────────────── */
function gridAxes(ox, oy, u, xr, yr, kids){
  var i;
  for(i = -xr; i <= xr; i++) kids.push(h('line', {key:'gx' + i, className:'grid',
    x1:fx(ox + i*u), y1:fx(oy - yr*u), x2:fx(ox + i*u), y2:fx(oy + yr*u)}));
  for(i = -yr; i <= yr; i++) kids.push(h('line', {key:'gy' + i, className:'grid',
    x1:fx(ox - xr*u), y1:fx(oy - i*u), x2:fx(ox + xr*u), y2:fx(oy - i*u)}));
  kids.push(h('line', {key:'ax', className:'axis', x1:fx(ox - xr*u), y1:oy, x2:fx(ox + xr*u), y2:oy}));
  kids.push(h('line', {key:'ay', className:'axis', x1:ox, y1:fx(oy - yr*u), x2:ox, y2:fx(oy + yr*u)}));
  kids.push(T(ox + xr*u - 3, oy - 6, 'x', 'lbl', 'end', 'lx'));
  kids.push(T(ox - 7, oy - yr*u + 11, 'y', 'lbl', 'end', 'ly'));
  kids.push(T(ox - 6, oy + 13, 'O', 'lbl', 'end', 'lo'));
}
function fnPath(f, x0, x1, mp, ymin, ymax){
  var segs = [], cur = [], n = 140;
  for(var i = 0; i <= n; i++){
    var x = x0 + (x1 - x0) * i / n, y = f(x);
    if(y >= ymin && y <= ymax){
      var q = mp(x, y);
      cur.push((cur.length ? 'L' : 'M') + fx(q[0]) + ' ' + fx(q[1]));
    } else if(cur.length){ segs.push(cur.join(' ')); cur = []; }
  }
  if(cur.length) segs.push(cur.join(' '));
  return segs.join(' ');
}

var ALL_CARDS = ATTACHED.concat(NUM_CARDS, FUNC_CARDS, GEOF_CARDS, GEOP_CARDS);

ALL_CARDS.forEach(function(c){ CARD_BY_ID[c.id] = c; });

var CATEGORIES = {num:'數與代數', eq:'方程式與函數', geo:'幾何', stat:'統計與機率'};
var GRADES = {7:'七年級', 8:'八年級', 9:'九年級'};

var REASON_LABEL = {};
ERROR_REASONS.forEach(function(r){ REASON_LABEL[r.id] = r.label; });

var LADDER_UNSURE = [1, 3, 7];
var LADDER_KNOWN = [3, 7, 14, 30];
var STORAGE_KEY = 'mathCoach.progress.v1';
var DB_PATH = 'progress/main';
var PROGRESS_VERSION = 1;

function todayStr(d){
  var t = d || new Date();
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') +
         '-' + String(t.getDate()).padStart(2, '0');
}
function addDays(dateStr, n){
  var p = dateStr.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() + n);
  return todayStr(d);
}
function daysBetween(a, b){
  var pa = a.split('-'), pb = b.split('-');
  var da = new Date(Number(pa[0]), Number(pa[1]) - 1, Number(pa[2]));
  var db = new Date(Number(pb[0]), Number(pb[1]) - 1, Number(pb[2]));
  return Math.round((db - da) / 86400000);
}

function emptyCard(){
  return {seen:0, due:null, successDays:[],
    recall:{c:0, t:0}, recognition:{c:0, t:0}, application:{c:0, t:0},
    unsureIdx:0, knownIdx:0, lapses:0, reasons:{}, lastResult:null, lastAt:null};
}
function emptyProgress(){
  return {version:PROGRESS_VERSION, cards:{}, recentWrong:[],
    createdAt:todayStr(), updatedAt:todayStr()};
}
function getCP(progress, id){
  if(!progress.cards[id]) progress.cards[id] = emptyCard();
  var cp = progress.cards[id];
  ['recall', 'recognition', 'application'].forEach(function(k){
    if(!cp[k]) cp[k] = {c:0, t:0};
  });
  if(!cp.successDays) cp.successDays = [];
  if(!cp.reasons) cp.reasons = {};
  return cp;
}
/* 熟練條件：不同日期成功回想 ≥ 2、辨識答對 ≥ 1、應用答對 ≥ 2 */
function isMastered(cp){
  if(!cp) return false;
  return (cp.successDays || []).length >= 2 &&
         (cp.recognition ? cp.recognition.c : 0) >= 1 &&
         (cp.application ? cp.application.c : 0) >= 2;
}
function masteryLevel(cp){
  if(!cp || cp.seen === 0) return 0;
  return isMastered(cp) ? 2 : 1;
}
var MASTERY_LABEL = ['尚未練習', '練習中', '已熟練'];

/* 記錄一次作答 */
function recordAnswer(progress, id, kind, correct, reason){
  var cp = getCP(progress, id), today = todayStr();
  cp.seen++;
  cp[kind].t++;
  if(correct){
    cp[kind].c++;
    if(kind === 'recall' && cp.successDays.indexOf(today) < 0) cp.successDays.push(today);
  } else {
    cp.lapses++;
    if(reason) cp.reasons[reason] = (cp.reasons[reason] || 0) + 1;
    progress.recentWrong.unshift({id:id, kind:kind, reason:reason || null, date:today});
    progress.recentWrong = progress.recentWrong.slice(0, 30);
  }
  cp.lastResult = correct ? 'ok' : 'miss';
  cp.lastAt = today;
  progress.updatedAt = today;
  return cp;
}
/* 依自評與對錯決定下次複習日 */
function scheduleCard(progress, id, confidence, correct){
  var cp = getCP(progress, id), today = todayStr(), gap;
  if(!correct){
    gap = 1;                       /* 答錯：隔天一定再複習 */
    cp.unsureIdx = 0; cp.knownIdx = 0;
  } else if(confidence === 'no'){
    gap = 1;
    cp.unsureIdx = 0; cp.knownIdx = 0;
  } else if(confidence === 'maybe'){
    gap = LADDER_UNSURE[Math.min(cp.unsureIdx, LADDER_UNSURE.length - 1)];
    cp.unsureIdx = Math.min(cp.unsureIdx + 1, LADDER_UNSURE.length - 1);
    cp.knownIdx = 0;
  } else {
    gap = LADDER_KNOWN[Math.min(cp.knownIdx, LADDER_KNOWN.length - 1)];
    cp.knownIdx = Math.min(cp.knownIdx + 1, LADDER_KNOWN.length - 1);
  }
  cp.due = addDays(today, gap);
  progress.updatedAt = today;
  return gap;
}
/* 下一題該考哪一種形式 */
function pickKind(cp){
  if(!cp || cp.recall.t === 0) return 'recall';
  if(cp.recognition.t === 0) return 'recognition';
  if(cp.application.c < 2) return 'application';
  var arr = [['recall', cp.recall.t], ['recognition', cp.recognition.t],
             ['application', cp.application.t]];
  arr.sort(function(a, b){ return a[1] - b[1]; });
  return arr[0][0];
}
function dueList(progress, today){
  var t = today || todayStr();
  return ALL_CARDS.filter(function(c){
    var cp = progress.cards[c.id];
    return cp && cp.due && daysBetween(cp.due, t) >= 0;
  });
}
function newList(progress){
  return ALL_CARDS.filter(function(c){
    var cp = progress.cards[c.id];
    return !cp || cp.seen === 0;
  });
}
function shuffle(arr, seed){
  var a = arr.slice(), s = seed || 1;
  for(var i = a.length - 1; i > 0; i--){
    s = (s * 9301 + 49297) % 233280;
    var j = Math.floor(s / 233280 * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* 組出本次練習的題目佇列 */
function buildQueue(progress, opts){
  opts = opts || {};
  var limit = opts.limit || 12, today = todayStr(), pool;
  if(opts.mode === 'free'){
    pool = (opts.cards && opts.cards.length ? opts.cards : ALL_CARDS);
    pool = shuffle(pool, Date.now() % 233280).slice(0, limit);
  } else {
    var due = dueList(progress, today).sort(function(a, b){
      return daysBetween(progress.cards[b.id].due, today) -
             daysBetween(progress.cards[a.id].due, today);
    });
    pool = due.slice(0, limit);
    if(pool.length < limit){
      var fresh = newList(progress).slice(0, limit - pool.length);
      pool = pool.concat(fresh);
    }
  }
  return pool.map(function(c){
    return {cardId:c.id, kind:pickKind(progress.cards[c.id]), retry:false};
  });
}
/* 最容易忘記的知識點 */
function weakest(progress, n){
  var scored = ALL_CARDS.map(function(c){
    var cp = progress.cards[c.id];
    if(!cp || cp.seen === 0) return null;
    var tot = cp.recall.t + cp.recognition.t + cp.application.t;
    var ok = cp.recall.c + cp.recognition.c + cp.application.c;
    var acc = tot ? ok / tot : 1;
    var score = cp.lapses * 2 + (1 - acc) * 5 + (cp.lastResult === 'miss' ? 2 : 0);
    return score > 0 ? {card:c, score:score, acc:acc, lapses:cp.lapses} : null;
  }).filter(Boolean);
  scored.sort(function(a, b){ return b.score - a.score; });
  return scored.slice(0, n || 3);
}
function kindStats(progress, kind){
  var c = 0, t = 0;
  ALL_CARDS.forEach(function(card){
    var cp = progress.cards[card.id];
    if(cp && cp[kind]){ c += cp[kind].c; t += cp[kind].t; }
  });
  return {c:c, t:t, pct:t ? Math.round(c / t * 100) : null};
}
function categoryStats(progress){
  return Object.keys(CATEGORIES).map(function(k){
    var list = ALL_CARDS.filter(function(c){ return c.category === k; });
    var mastered = list.filter(function(c){ return isMastered(progress.cards[c.id]); }).length;
    var started = list.filter(function(c){
      var cp = progress.cards[c.id]; return cp && cp.seen > 0;
    }).length;
    return {key:k, name:CATEGORIES[k], total:list.length, mastered:mastered, started:started,
            pct:list.length ? Math.round(mastered / list.length * 100) : 0};
  });
}
function reasonStats(progress){
  var acc = {};
  ALL_CARDS.forEach(function(card){
    var cp = progress.cards[card.id];
    if(cp && cp.reasons) Object.keys(cp.reasons).forEach(function(r){
      acc[r] = (acc[r] || 0) + cp.reasons[r];
    });
  });
  return Object.keys(acc).map(function(r){
    return {id:r, label:REASON_LABEL[r] || r, n:acc[r]};
  }).sort(function(a, b){ return b.n - a.n; });
}

/* ── 本次練習的暫存狀態 ─────────────────────────────────────────────
   這個網站不使用任何資料儲存：進度只放在 React state（記憶體）裡，
   重新整理或關閉分頁就會從頭開始。                                     */
var SESSION_NOTE = '進度只保留在這個分頁，重新整理後會從頭開始。';

/* 還沒練熟的卡（含完全沒練過的），用來排出下一輪練習 */
function pendingList(progress){
  return ALL_CARDS.filter(function(c){
    return !isMastered(progress.cards[c.id]);
  });
}
/* 本次已安排複習間隔的卡，依間隔長短排序（純粹展示間隔複習的安排） */
function scheduleList(progress){
  var today = todayStr();
  return ALL_CARDS.filter(function(c){
    var cp = progress.cards[c.id];
    return cp && cp.due;
  }).map(function(c){
    return {card:c, gap:daysBetween(today, progress.cards[c.id].due)};
  }).sort(function(a, b){ return a.gap - b.gap; });
}
/* 本次練習的總計（每答一題就即時更新） */
function sessionTotals(progress){
  var n = 0, ok = 0;
  ALL_CARDS.forEach(function(c){
    var cp = progress.cards[c.id];
    if(!cp) return;
    ['recall', 'recognition', 'application'].forEach(function(k){
      n += cp[k].t; ok += cp[k].c;
    });
  });
  return {n:n, ok:ok, pct:n ? Math.round(ok / n * 100) : null};
}

function recordReason(progress, id, reason){
  var cp = getCP(progress, id);
  if(!reason) return;
  cp.reasons[reason] = (cp.reasons[reason] || 0) + 1;
  if(progress.recentWrong.length && progress.recentWrong[0].id === id){
    progress.recentWrong[0].reason = reason;
  }
}

function cx(){

}

function Sheet(props){
  useEffect(function(){
    function onKey(e){ if(e.key === 'Escape') props.onClose(); }
    document.addEventListener('keydown', onKey);

/* ── 作答元件：公式積木填空 ────────────────────────────────────────── */
function BlankAnswer(props){
  var q = props.q, filled = props.filled, locked = props.locked;
  var active = props.active;
  var parts = String(q.template).split(/@(\d+)/);
  var nodes = [];
  parts.forEach(function(seg, i){
    if(i % 2 === 0){
      if(seg) nodes.push(h(M, {key:'s' + i, t:seg}));
    } else {
      var bi = Number(seg) - 1;
      var val = filled[bi];
      var state = locked ? (val === q.blanks[bi] ? 'ok' : 'bad')
                         : (active === bi ? 'active' : (val ? 'filled' : ''));
      nodes.push(h('button', {key:'b' + i, type:'button',
        className:cx('blank', state), disabled:locked,
        'aria-label':'第 ' + (bi + 1) + ' 個空格' + (val ? '，已填入答案' : '，尚未填入'),
        onClick:function(){ props.onBlankClick(bi); }},
        val ? h(M, {t:val}) : '？'));
    }
  });
  var usedCount = {};
  filled.forEach(function(v){ if(v) usedCount[v] = (usedCount[v] || 0) + 1; });
  return h('div', null,
    h('div', {className:'mwrap'},
      h('div', {style:{display:'flex', flexWrap:'wrap', alignItems:'center',
        gap:'2px 0', padding:'10px 2px', fontSize:'18px', lineHeight:'2'}}, nodes)),
    locked ? null : h('div', null,
      h('div', {className:'eyebrow', style:{marginTop:'8px'}}, '公式積木'),
      h('div', {className:'bank'}, q.bank.map(function(tok, i){
        return h('button', {key:i, type:'button',
          className:cx('token', usedCount[tok] ? 'used' : ''),
          onClick:function(){ props.onToken(tok); }}, h(M, {t:tok}));
      }))));
}

/* ── 作答元件：選項 ────────────────────────────────────────────────── */
var OPT_KEYS = ['A', 'B', 'C', 'D'];
function ChoiceAnswer(props){
  var q = props.q, picked = props.picked, locked = props.locked;
  return h('div', {role:'group', 'aria-label':'選項'}, q.options.map(function(o, i){
    var state = '';
    if(locked){
      if(i === q.answer) state = 'ok';
      else if(i === picked) state = 'bad';
    }
    return h('button', {key:i, type:'button', className:cx('opt', state),
      'aria-pressed':picked === i, disabled:locked,
      onClick:function(){ props.onPick(i); }},
      h('span', {className:'key'}, OPT_KEYS[i]),
      h('span', {style:{flex:1}}, o.math ? h(M, {t:o.math}) : o.t),
      locked && i === q.answer ? h('span', {className:'mark'}, '✓ 正解') : null,
      locked && i === picked && i !== q.answer ? h('span', {className:'mark'}, '✕ 你選的') : null);
  }));
}

/* ── 作答元件：數字鍵盤 ────────────────────────────────────────────── */
var PAD = ['7', '8', '9', '⌫', '4', '5', '6', '−', '1', '2', '3', '.', '0', '清除'];
function NumericAnswer(props){
  var val = props.value, locked = props.locked;
  function press(k){
    if(locked) return;
    if(k === '⌫') props.onChange(val.slice(0, -1));
    else if(k === '清除') props.onChange('');
    else if(k === '−') props.onChange(val.indexOf('-') === 0 ? val.slice(1) : '-' + val);
    else props.onChange(val + k);
  }
  return h('div', null,
    h('div', {className:'numview'},
      h('span', {style:{fontFamily:'"IBM Plex Mono",monospace', fontSize:'20px',
        fontVariantNumeric:'tabular-nums'}},
        val ? val.replace(/-/g, '−') : '　'),
      props.unit ? h('span', {className:'muted small', style:{marginLeft:'6px'}}, props.unit) : null),
    locked ? null : h('div', {className:'keypad'}, PAD.map(function(k){
      return h('button', {key:k, type:'button', onClick:function(){ press(k); },
        'aria-label':k === '⌫' ? '刪除一個字' : k,
        style:k === '清除' ? {gridColumn:'span 3'} : null}, k);
    })));
}
function numEq(a, b){
  var na = parseFloat(String(a).replace(/−/g, '-')), nb = parseFloat(String(b).replace(/−/g, '-'));
  if(!isNaN(na) && !isNaN(nb)) return Math.abs(na - nb) < 1e-9;
  return String(a).trim() === String(b).trim();
}

function renderAnswer(q){
  if(q.type === 'numeric'){
    return h('b', null, String(q.answer).replace(/-/g, '−') + (q.unit ? ' ' + q.unit : ''));
  }
  if(q.options && q.options[q.answer]){
    var o = q.options[q.answer];
    return h('span', null,
      h('b', null, OPT_KEYS[q.answer] + '　'),
      o.math ? h(M, {t:o.math}) : h('b', null, o.t),
      q.unit ? h('span', null, ' ' + q.unit) : null);
  }
  return h('b', null, '—');
}

/* ── 練習流程 ─────────────────────────────────────────────────────── */
function SessionView(props){
  var st = props.state, card = CARD_BY_ID[st.queue[st.idx].cardId];
  var kind = st.queue[st.idx].kind;
  var q = kind === 'recall' ? card.recallPrompt
        : kind === 'recognition' ? card.recognitionQuestion
        : card.applicationQuestion;
  var locked = st.phase !== 'answer';
  var canSubmit = q.type === 'blank' ? st.filled.every(function(v){ return !!v; })
                : q.type === 'numeric' ? st.num.length > 0
                : st.picked !== null;

  function submit(){
    var correct;
    if(q.type === 'blank') correct = st.filled.every(function(v, i){ return v === q.blanks[i]; });
    else if(q.type === 'numeric') correct = numEq(st.num, q.answer);
    else correct = st.picked === q.answer;
    props.onSubmit(correct);
  }

  var head = h('div', null,
    h('div', {className:'progressline', role:'progressbar',
      'aria-valuenow':st.idx + 1, 'aria-valuemin':1, 'aria-valuemax':st.queue.length,
      'aria-label':'練習進度'},
      st.queue.map(function(item, i){
        var cls = i < st.idx ? (st.results[i] === false ? 'miss' : 'done') : (i === st.idx ? 'now' : '');
        return h('i', {key:i, className:cls});
      })),
    h('div', {style:{display:'flex', alignItems:'baseline', gap:'8px', marginBottom:'6px'}},
      h('span', {className:'eyebrow'}, KINDS[kind]),
      h('span', {className:'tiny muted', style:{marginLeft:'auto'}},
        (st.idx + 1) + ' / ' + st.queue.length),
      h('button', {className:'tiny muted', style:{textDecoration:'underline'},
        onClick:props.onQuit}, '結束')),
    st.queue[st.idx].retry
      ? h('div', {className:'banner', style:{marginBottom:'10px'}},
          h('span', null, '↻'), h('span', null, '這張剛才答錯了，再練一次。'))
      : null);

  /* ① 作答狀態：不顯示公式與答案 */
  if(st.phase === 'answer' || st.phase === 'reason'){
    return h('div', null, head,
      h('div', {className:'block'},
        h('h3', null, q.prompt),
        card.diagramType && kind !== 'recall'
          ? h('div', {style:{marginTop:'10px'}},
              h(DiagramSlot, {type:card.diagramType, data:card.diagramData,
                highlight:st.hint >= 2, reveal:false}))
          : (card.diagramType && st.hint >= 2
              ? h('div', {style:{marginTop:'10px'}},

                    highlight:true, reveal:false}))
              : null),
        q.given ? h('div', {style:{marginTop:'8px'}}, h(MB, {t:q.given})) : null,
        h('div', {style:{marginTop:'10px'}},
          q.type === 'blank'
            ? h(BlankAnswer, {q:q, filled:st.filled, active:st.active, locked:locked,
                onBlankClick:props.onBlankClick, onToken:props.onToken})
            : q.type === 'numeric'
              ? h(NumericAnswer, {value:st.num, unit:q.unit, locked:locked, onChange:props.onNum})
              : h(ChoiceAnswer, {q:q, picked:st.picked, locked:locked, onPick:props.onPick}))),
      st.hint >= 1 ? h('div', {className:'banner', style:{marginTop:'10px'}},
        h('span', {'aria-hidden':'true'}, '①'),
        h('span', null, h('b', null, '提示一（使用時機）：'), q.hint1 || card.usageConditions)) : null,
      st.hint >= 2 ? h('div', {className:'banner teal', style:{marginTop:'8px'}},
        h('span', {'aria-hidden':'true'}, '②'),
        h('span', null, h('b', null, '提示二：'),
          card.diagramType ? '圖上已用琥珀色粗線標出要用到的邊、角或弧。'
                           : ('關鍵符號 ── ' + card.variables.map(function(v){
                               return v.sym + '：' + v.desc; }).join('；')))) : null,
      st.phase === 'reason'
        ? h('div', {className:'block', style:{marginTop:'10px'}},
            h('div', {className:'banner red', style:{marginBottom:'10px'}},
              h('span', {'aria-hidden':'true'}, '✕'),
              h('span', null, '這題答錯了。選一個最主要的原因，之後會幫你追蹤。')),
            h('div', {className:'chips'}, ERROR_REASONS.map(function(r){
              return h('button', {key:r.id, className:'chip', type:'button',

                onClick:function(){ props.onReason(r.id); }}, r.label);

              h('button', {className:'btn', disabled:!st.reason, onClick:props.onToExplain},
                '看解析')))
        : h('div', {className:'btnrow'},
            st.hint < 2
              ? h('button', {className:'btn ghost', onClick:props.onHint},
                  st.hint === 0 ? '提示' : '再一個提示')
              : null,
            h('button', {className:'btn primary', disabled:!canSubmit, onClick:submit}, '送出答案')));
  }

  /* ② 解析狀態 */
  var correct = st.results[st.idx];
  return h('div', null, head,
    h('div', {className:cx('banner', correct ? 'teal' : 'red')},
      h('span', {'aria-hidden':'true'}, correct ? '✓' : '✕'),
      h('span', null, correct ? '答對了。' : ('答錯了' + (st.reason ? '（' + REASON_LABEL[st.reason] + '）' : '') + '，看完解析再判斷熟悉度。'))),
    h('div', {className:'block', style:{marginTop:'10px'}},

        h(DiagramSlot, {type:card.diagramType, data:card.diagramData,
          highlight:false, reveal:true})) : null,
      h('div', {className:'eyebrow', style:{marginTop:'12px'}}, '每個符號的意思'),
      h('ul', {className:'plain small'}, card.variables.map(function(v, i){
        return h('li', {key:i}, h('b', null, v.sym), '：', v.desc);
      })),
      h('div', {className:'eyebrow', style:{marginTop:'12px'}}, '代入過程'),
      h('div', {className:'rulebox'},
        h('div', {className:'tiny muted', style:{marginBottom:'4px'}}, card.workedExample.title),
        h('ol', {className:'steps small'}, card.workedExample.steps.map(function(s, i){
          return h('li', {key:i},
            h('div', {className:'tiny muted'}, s.label),
            s.math ? h(MB, {t:s.math}) : h('div', null, s.text));
        }))),
      h('div', {className:'banner teal', style:{marginTop:'10px'}},
        h('span', {'aria-hidden':'true'}, '＝'),
        h('span', null, h('b', null, '答案：'), h(M, {t:card.workedExample.answer}))),
      kind !== 'recall'
        ? h('div', null,
            h('div', {className:'eyebrow', style:{marginTop:'12px'}}, '本題正解'),
            h('div', {className:'banner', style:{marginBottom:'8px'}},
              h('span', {'aria-hidden':'true'}, '→'),
              h('span', null, renderAnswer(q))),
            q.steps ? h('ol', {className:'steps small'}, q.steps.map(function(s, i){
              return h('li', {key:i}, s);
            })) : null,
            q.why ? h('p', {className:'small'}, q.why) : null)
        : null,
      h('div', {className:'eyebrow', style:{marginTop:'12px'}}, '常見錯法'),
      h('ul', {className:'plain small'}, card.commonMistakes.map(function(m, i){
        return h('li', {key:i}, m);
      })),
      h('p', {className:'small muted', style:{marginTop:'10px'}}, card.explanation)),
    h('div', {className:'block', style:{marginTop:'10px'}},
      h('div', {className:'eyebrow'}, '這張卡你現在的感覺'),
      h('div', {className:'gap-s', style:{marginTop:'8px'}},
        [['no', '不會', '明天再出現'], ['maybe', '還不確定', '1、3、7 天後'],
         ['yes', '會了', '3、7、14、30 天後']].map(function(o){
          return h('button', {key:o[0], className:'opt', type:'button', style:{marginBottom:0},
            onClick:function(){ props.onConfidence(o[0]); }},
            h('span', {style:{flex:1, fontWeight:600}}, o[1]),

        }))));
}

    var o = {}; Object.keys(f).forEach(function(k){ o[k] = f[k]; });
