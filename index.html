<title>會考數學公式教練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ── tokens ─────────────────────────────────────────────────────────── */
:root{
  --paper:#F2EEE4; --sheet:#FCFAF5; --sheet-2:#EFEADC;
  --ink:#16273D; --ink-soft:#5A6A7D; --ink-faint:#8A96A3;
  --teal:#0C7361; --teal-bg:#E1EFEA; --teal-line:#9CC9BE;
  --amber:#A9700B; --amber-bg:#F6EBD5; --amber-line:#DCC08A;
  --red:#9E3535; --red-bg:#F6E4E1; --red-line:#DCACA4;
  --rule:#D9D2C4; --rule-soft:#E7E1D4;
  --focus:#0C7361;
  --shadow:0 1px 0 rgba(22,39,61,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A20; --sheet:#1C242C; --sheet-2:#232D36;
    --ink:#E9E4D8; --ink-soft:#9FADBA; --ink-faint:#77848F;
    --teal:#4FC3AB; --teal-bg:#13322D; --teal-line:#2E6C5E;
    --amber:#E3A44A; --amber-bg:#332612; --amber-line:#6E5628;
    --red:#E88B80; --red-bg:#361D1B; --red-line:#6E3B36;
    --rule:#2E3A45; --rule-soft:#26313A;
    --focus:#4FC3AB;
    --shadow:0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#141A20; --sheet:#1C242C; --sheet-2:#232D36;
  --ink:#E9E4D8; --ink-soft:#9FADBA; --ink-faint:#77848F;
  --teal:#4FC3AB; --teal-bg:#13322D; --teal-line:#2E6C5E;
  --amber:#E3A44A; --amber-bg:#332612; --amber-line:#6E5628;
  --red:#E88B80; --red-bg:#361D1B; --red-line:#6E3B36;
  --rule:#2E3A45; --rule-soft:#26313A;
  --focus:#4FC3AB;
  --shadow:0 1px 0 rgba(0,0,0,.3);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── shell ──────────────────────────────────────────────────────────── */
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--sheet);
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;overflow-x:hidden}
@media (max-width:479px){.app{border-left:none;border-right:none}}
.topbar{position:sticky;top:0;z-index:30;background:var(--sheet);
  border-bottom:1px solid var(--rule);padding:10px 16px 8px;
  display:flex;align-items:baseline;gap:8px}
.topbar h1{margin:0;font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;letter-spacing:.02em}
.topbar .sub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);margin-left:auto;letter-spacing:.04em}
.main{flex:1;padding:14px 16px 92px}

/* ── bottom nav ─────────────────────────────────────────────────────── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--sheet);
  border-top:1px solid var(--rule);display:flex;
  max-width:460px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0)}
.nav button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-soft);font-size:11px;letter-spacing:.02em;
  border-top:2px solid transparent;margin-top:-1px;transition:color .18s ease,border-color .18s ease}
.nav button[aria-current="page"]{color:var(--teal);border-top-color:var(--teal);font-weight:700}
.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.nav .badge{position:absolute;transform:translate(13px,-13px);background:var(--amber);
  color:#FFF9EC;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  min-width:16px;height:16px;line-height:16px;border-radius:8px;padding:0 4px}
:root[data-theme="dark"] .nav .badge,
:root:not([data-theme="light"]) .nav .badge{color:#1A1206}

/* ── structural type ────────────────────────────────────────────────── */
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
.secthead{display:flex;align-items:baseline;gap:10px;margin:20px 0 8px}
.secthead:first-child{margin-top:4px}
.secthead .line{flex:1;height:1px;background:var(--rule-soft)}
.secthead .right{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint)}
.secthead h2{margin:0;font-family:"Noto Serif TC",serif;font-size:15px;font-weight:700;letter-spacing:.02em}
h3{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:700;margin:0;text-wrap:balance}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}

/* ── note block ─────────────────────────────────────────────────────── */
/* 有邊框的盒子只留給「可以點的東西」與需要框住的作答區；
   一般內容分段改用留白與細線，避免整頁都是小方塊 */
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:14px}
.block+.block{margin-top:10px}
.block.tint{background:var(--sheet-2)}
/* 首頁主卡：今天要做什麼 */
.todo{background:var(--sheet-2);border:1px solid var(--rule);border-radius:6px;
  padding:14px;display:flex;flex-direction:column;gap:12px}
.todo-head{display:flex;align-items:baseline;justify-content:space-between}
.todo-lead{display:flex;align-items:center;gap:14px}
.todo-lead .big{font-size:46px;color:var(--teal)}
.todo .btn{width:100%}

/* 沒有邊框的內容區段 */
.panel{display:flex;flex-direction:column;gap:10px}
.panel+.panel{margin-top:18px;padding-top:18px;border-top:1px solid var(--rule-soft)}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-s{display:flex;flex-direction:column;gap:6px}
/* 一句話的空狀態，不再佔一整個盒子 */
.emptyline{font-size:12.5px;color:var(--ink-faint);padding:2px 0}

/* 章節／原因：一行一條，名稱、數字、進度線並排 */
.catrow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.catrow .catname{font-size:13.5px}
.catrow .catnum{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums}
.catrow .progressbar{grid-column:1/-1;margin-top:1px}
.progressbar i.warn{background:var(--amber)}

/* 卡片搜尋 */
.search{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--rule);
  border-radius:4px;background:var(--sheet);font-size:15px;margin-bottom:8px}
.search::placeholder{color:var(--ink-faint)}

/* 收合次要細節：一個畫面最多一個 */
details.more{border-top:1px solid var(--rule-soft);margin-top:14px}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;
  padding:11px 0 10px;font-size:13px;font-weight:500;color:var(--ink-soft);min-height:44px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:7px;height:7px;margin-left:auto;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translateY(-2px);transition:transform .18s ease}
details.more[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
details.more>summary:hover{color:var(--ink)}
details.more .morebody{display:flex;flex-direction:column;gap:14px;padding-bottom:4px}

/* 作答時的動作列釘在畫面底部，拇指按得到 */
.actionbar{position:sticky;bottom:0;z-index:20;margin:14px -16px 0;padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,transparent,var(--sheet) 22%);
  display:flex;gap:8px}
.actionbar .btn{width:auto;flex:1}
.actionbar .btn.ghost{flex:0 0 auto;min-width:96px}
.rulebox{border-left:1px solid var(--rule);padding-left:14px;margin-left:3px}

/* margin-rule list: real sequences only */
ol.steps{list-style:none;margin:0;padding:0 0 0 30px;position:relative}
ol.steps::before{content:"";position:absolute;left:14px;top:4px;bottom:4px;width:1px;background:var(--rule)}
ol.steps li{position:relative;margin-bottom:10px}
ol.steps li:last-child{margin-bottom:0}
ol.steps li::before{content:counter(sc);counter-increment:sc;position:absolute;left:-30px;width:21px;
  text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--ink-faint);top:2px}
/* 巢狀時只留外層的邊界線，避免兩條平行的直線 */
.rulebox ol.steps{padding-left:26px}
.rulebox ol.steps::before{display:none}
.rulebox ol.steps li::before{left:-26px;width:17px}
ol.steps{counter-reset:sc}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{position:relative;padding-left:15px;margin-bottom:6px}
ul.plain li:last-child{margin-bottom:0}
ul.plain li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:1px;background:var(--ink-faint)}

/* ── tags ───────────────────────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1.5;
  padding:1px 7px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-soft);
  background:var(--sheet-2);white-space:nowrap}
.tag.amber{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.tag.teal{color:var(--teal);border-color:var(--teal-line);background:var(--teal-bg)}
.tag.red{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}
.tag.ghost{background:transparent}
.tagrow{display:flex;flex-wrap:wrap;gap:5px}

/* ── buttons ────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:10px 16px;border-radius:4px;border:1px solid var(--ink);
  background:var(--ink);color:var(--sheet);font-weight:700;font-size:15px;width:100%;
  transition:opacity .18s ease,background-color .18s ease}
.btn:hover{opacity:.88}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#FBFEFD}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#0B1F1A}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule);font-weight:500}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red-line);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;width:auto}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{width:auto;flex:1}

/* ── chips (filters, options, tokens) ───────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:32px;padding:4px 11px;border:1px solid var(--rule);border-radius:16px;
  font-size:12.5px;color:var(--ink-soft);background:var(--sheet);
  transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet);font-weight:500}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  min-height:46px;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;
  background:var(--sheet);margin-bottom:8px;transition:border-color .18s ease,background-color .18s ease}
.opt:last-child{margin-bottom:0}
.opt .key{flex:none;width:20px;height:20px;border:1px solid var(--rule);border-radius:3px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;line-height:19px;
  text-align:center;color:var(--ink-soft);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--sheet-2)}
.opt[aria-pressed="true"] .key{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.opt.ok{border-color:var(--teal);background:var(--teal-bg)}
.opt.ok .key{background:var(--teal);border-color:var(--teal);color:#FBFEFD}
.opt.bad{border-color:var(--red);background:var(--red-bg)}
.opt.bad .key{background:var(--red);border-color:var(--red);color:#FFF6F5}
.opt .mark{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.ok .mark{color:var(--teal)}
.opt.bad .mark{color:var(--red)}

/* ── math ───────────────────────────────────────────────────────────── */
.m{font-family:"Noto Serif TC",Georgia,"Times New Roman",serif;line-height:1.15;
  white-space:nowrap;display:inline-block;vertical-align:-.15em}
.m .v{font-style:italic;padding-right:.03em}
.m .n{font-family:"IBM Plex Mono",monospace;font-size:.92em;font-variant-numeric:tabular-nums}
.m .op{padding:0 .22em}
.m .rel{padding:0 .3em}
.m .fn{padding-right:.12em}
.m .tx{font-family:"Noto Sans TC",sans-serif;font-style:normal;font-size:.9em;padding:0 .08em}
.m .sup{font-size:.72em;vertical-align:.52em;line-height:0}
.m .sub{font-size:.72em;vertical-align:-.28em;line-height:0}
.m .frac{display:inline-flex;flex-direction:column;vertical-align:middle;
  text-align:center;margin:0 .15em;font-size:.94em}
.m .frac>span{padding:0 .28em;display:block}
.m .frac.dfrac{font-size:1.06em}
.m .frac .den{border-top:1px solid currentColor;padding-top:.08em;margin-top:.08em}
.m .sqrt{display:inline-flex;align-items:stretch;margin:0 .06em}
.m .sqrt .sign{display:flex;align-items:flex-end;font-size:1.06em;line-height:1;
  transform:scaleY(1.12);transform-origin:bottom}
/* 根號內含空格或分數時，勾號要跟著長高才蓋得住 */
.m .sqrt:has(.blank) .sign{transform:scaleY(2.2)}
.m .sqrt:has(.frac) .sign{transform:scaleY(1.9)}
.m .sqrt .cand{border-top:1px solid currentColor;padding:.1em .16em 0 .06em;margin-top:.14em}
.m .ovl{border-top:1px solid currentColor;padding-top:.04em}
.m.blk{display:block;white-space:normal;text-align:center;font-size:1.14em;
  padding:8px 2px;overflow-x:auto;overflow-y:hidden}
/* 展示型公式：純算式沒有斷點會維持一行，含中文的長公式才會在中文處折行 */
.m.blk>span{white-space:normal}
.m.blk .frac,.m.blk .sqrt,.m.blk .ovl,.m.blk .sc{white-space:nowrap}
.m .sc{white-space:nowrap}
/* 清單裡的長公式改成折行，不要橫向捲動 */
.m.flow{display:block;white-space:normal;text-align:left;line-height:1.9;vertical-align:baseline}
.m.flow>span{white-space:normal}
.m.flow .frac,.m.flow .sqrt,.m.flow .ovl,.m.flow .sc{white-space:nowrap}
.mwrap{overflow-x:auto;max-width:100%}
.formula-card{background:var(--sheet-2);border:1px solid var(--rule);border-radius:4px;
  padding:6px 10px;margin:2px 0}
.formula-card.hidden{background:repeating-linear-gradient(135deg,var(--sheet-2),var(--sheet-2) 6px,var(--sheet) 6px,var(--sheet) 12px);
  color:var(--ink-faint);text-align:center;padding:14px 10px;font-size:13px}

/* ── blanks / token bank ────────────────────────────────────────────── */
.blank{display:inline-flex;align-items:center;justify-content:center;
  min-width:50px;min-height:34px;padding:2px 8px;margin:0 3px;
  border:1px dashed var(--ink-faint);border-radius:3px;background:var(--sheet);
  vertical-align:middle;line-height:1.2;
  transition:border-color .18s ease,background-color .18s ease}
/* 空格出現在分數、根號或指數裡時要縮小，但仍保持完整可讀 */
.m .frac .blank,.m .sqrt .blank{min-width:40px;min-height:28px;padding:1px 6px;margin:0 1px}
.m .sup .blank,.m .sub .blank{min-width:30px;min-height:20px;padding:0 4px;margin:0 1px}
.m.blk .blank{margin:2px 3px}
.blank.active{border-style:solid;border-color:var(--teal);background:var(--teal-bg);border-width:2px}
.blank.filled{border-style:solid;border-color:var(--rule)}
.blank.ok{border-color:var(--teal);background:var(--teal-bg)}
.blank.bad{border-color:var(--red);background:var(--red-bg)}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.token{min-height:40px;padding:5px 13px;border:1px solid var(--rule);border-radius:4px;
  background:var(--sheet-2);transition:transform .18s ease,opacity .18s ease}
.token:active{transform:translateY(1px)}
.token.used{opacity:.32;pointer-events:none}
/* 需要重複使用的積木，右上角標還要再用幾次 */
.token{position:relative}
.token .x2{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;line-height:17px;
  border-radius:9px;background:var(--teal);color:#FBFEFD;font-family:"IBM Plex Mono",monospace;
  font-size:10px;font-weight:600;text-align:center;padding:0 3px}
:root[data-theme="dark"] .token .x2,
:root:not([data-theme="light"]) .token .x2{color:#0B1F1A}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.keypad button{min-height:44px;border:1px solid var(--rule);border-radius:4px;
  background:var(--sheet-2);font-family:"IBM Plex Mono",monospace;font-size:16px}
.numview{min-height:46px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);
  display:flex;align-items:center;justify-content:center;padding:6px 12px;margin-top:4px}

/* ── figures ────────────────────────────────────────────────────────── */
.figure{border:1px solid var(--rule);border-radius:4px;padding:6px;background:var(--sheet);
  background-image:linear-gradient(var(--rule-soft) 1px,transparent 1px),
    linear-gradient(90deg,var(--rule-soft) 1px,transparent 1px);
  background-size:16px 16px;background-position:-1px -1px}
.figure svg{display:block;width:100%;height:auto}
.figcap{font-size:11.5px;color:var(--ink-soft);padding:6px 4px 2px;line-height:1.5;text-align:center}
svg .stk{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
svg .thin{stroke:var(--ink-soft);fill:none;stroke-width:1;stroke-linecap:round}
svg .dash{stroke:var(--ink-soft);fill:none;stroke-width:1.2;stroke-dasharray:4 3;stroke-linecap:round}
svg .hl{stroke:var(--amber);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .hl2{stroke:var(--teal);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .fillA{fill:var(--amber-bg);stroke:var(--amber-line);stroke-width:1}
svg .fillT{fill:var(--teal-bg);stroke:var(--teal-line);stroke-width:1}
svg text{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:11px;fill:var(--ink)}
svg text.lbl{font-family:"Noto Serif TC",Georgia,serif;font-style:italic;font-size:12.5px}
svg text.sm{font-size:9.5px;fill:var(--ink-soft)}
svg text.acc{fill:var(--amber);font-weight:600}
svg text.acc2{fill:var(--teal);font-weight:600}
/* 描邊光暈：讓標籤壓在格線或粗線上時仍然看得清楚 */
svg text.acc,svg text.acc2,svg text.halo{paint-order:stroke;stroke:var(--sheet);
  stroke-width:3px;stroke-linejoin:round}
svg .axis{stroke:var(--ink-soft);stroke-width:1.1}
svg .grid{stroke:var(--rule);stroke-width:.7}
svg .curve{stroke:var(--teal);stroke-width:2;fill:none;stroke-linecap:round}
svg .curve2{stroke:var(--amber);stroke-width:2;fill:none;stroke-dasharray:5 3;stroke-linecap:round}
svg .curve3{stroke:var(--ink-soft);stroke-width:1.6;fill:none;stroke-dasharray:1.5 3;stroke-linecap:round}
svg .dot{fill:var(--ink)}
svg .dotA{fill:var(--amber)}
svg .dotT{fill:var(--teal)}

/* ── stats ──────────────────────────────────────────────────────────── */
.metric{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.metric:last-child{border-bottom:none}
.metric .name{font-size:13.5px}
.metric .val{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums}
.metric .sub{grid-column:1/-1;font-size:11.5px;color:var(--ink-faint);
  font-family:"IBM Plex Mono",monospace}
.bar{grid-column:1/-1;height:5px;background:var(--sheet-2);border:1px solid var(--rule-soft);

  return h('line', {key:key, x1:fx(P[0]), y1:fx(P[1]), x2:fx(Q[0]), y2:fx(Q[1]), className:cls || 'stk'});
}
function poly(pts, cls, key){
  return h('polygon', {key:key, className:cls || 'stk',
    points:pts.map(function(p){ return fx(p[0]) + ',' + fx(p[1]); }).join(' ')});
}
function T(x, y, txt, cls, anchor, key){
  return h('text', {key:key || ('t' + fx(x) + '_' + fx(y) + '_' + String(txt).slice(0, 8)),
    x:fx(x), y:fx(y), className:cls || '', textAnchor:anchor || 'middle'}, txt);
}
/* 圖例：線型樣本 + 文字，用於避免標籤互相重疊 */
function legend(x, y, rows, key){
  var w = 0;
  rows.forEach(function(r){ w = Math.max(w, 30 + r.label.length * 8); });
  var out = [h('rect', {key:(key || 'lg') + 'bg', x:x - 6, y:y - 11, width:w + 10,
    height:rows.length * 16 + 6, rx:3,
    style:{fill:'var(--sheet)', fillOpacity:.9, stroke:'var(--rule)', strokeWidth:1}})];
  rows.forEach(function(r, i){
    var yy = y + i * 16;
    out.push(h('line', {key:(key || 'lg') + 's' + i, x1:x, y1:yy, x2:x + 20, y2:yy, className:r.cls}));
    out.push(h('text', {key:(key || 'lg') + 't' + i, x:x + 25, y:yy + 4,
      className:'sm', textAnchor:'start'}, r.label));
  });
  return out;
}
function VL(P, txt, dx, dy, key){  /* 頂點字母 */
  return h('text', {key:key || ('v' + txt), x:fx(P[0] + dx), y:fx(P[1] + dy),
    className:'lbl', textAnchor:'middle'}, txt);
}
function dot(P, cls, key, r){
  return h('circle', {key:key, cx:fx(P[0]), cy:fx(P[1]), r:r || 3, className:cls || 'dot'});
}

function Fig(props){
  return h('div', {className:'gap-s'},
    h('div', {className:'figure'},
      h('svg', {viewBox:props.vb || '0 0 300 200', role:'img',
        'aria-label':(props.title || '') + '。' + (props.desc || '')},
        h('title', null, props.title || ''),
        h('desc', null, props.desc || ''),
        props.children)),
    props.caption ? h('div', {className:'figcap'}, props.caption) : null);
}

/* ── 1. 三角形（內角／外角／中位線／高／邊角關係）──────────────────── */
function TriangleDiagram(p){
  var d = p.data || {}, v = d.variant || 'angles', HL = p.highlight, RV = p.reveal;
  var A = [150, 32], B = [46, 168], C = [262, 168];
  var kids = [], cap = '', title = '三角形', desc = '';
  if(v === 'angles' || v === 'exterior'){
    var D = [300, 168];
    kids.push(seg(C, D, 'dash', 'ext'));
    kids.push(poly([A, B, C], 'stk', 'tri'));
    kids.push(angleArc(A, B, C, 21, HL ? 'hl' : 'thin', 'aA'));
    kids.push(angleArc(B, C, A, 21, HL ? 'hl' : 'thin', 'aB'));
    kids.push(angleArc(C, A, B, 21, 'thin', 'aC'));
    kids.push(angleArc(C, A, D, 17, v === 'exterior' ? 'hl' : 'thin', 'aE'));
    kids.push(AL(A, B, C, 33, '∠A', 'sm', 'lA'));
    kids.push(AL(B, C, A, 33, '∠B', 'sm', 'lB'));
    kids.push(AL(C, A, B, 34, '∠C', 'sm', 'lC'));
    kids.push(AL(C, A, D, 30, v === 'exterior' ? '∠1' : '∠1', 'acc', 'lE'));
    kids.push(VL(A, 'A', 0, -10), VL(B, 'B', -11, 6), VL(C, 'C', -6, 17), VL(D, 'D', 8, 6));
    if(RV) kids.push(T(150, 118, v === 'exterior' ? '∠1 = ∠A + ∠B' : '∠A+∠B+∠C = 180°', 'acc'));
    title = v === 'exterior' ? '三角形的外角' : '三角形的內角';
    desc = '三角形 ABC，底邊 BC 向右延長到 D。∠A、∠B、∠C 為內角，∠1 為頂點 C 的外角。';
    cap = v === 'exterior' ? '∠1 是 C 的外角，兩個不相鄰內角是 ∠A 與 ∠B' : '三個內角 ∠A、∠B、∠C；虛線延長線外側的 ∠1 是外角';
  }
  else if(v === 'midsegment'){
    var M = midp(A, B), N = midp(A, C);
    kids.push(poly([A, B, C], 'stk', 'tri'));
    kids.push(seg(M, N, HL ? 'hl' : 'stk', 'mn'));
    kids.push.apply(kids, ticks(A, M, 1, 'tAM'));
    kids.push.apply(kids, ticks(M, B, 1, 'tMB'));
    kids.push.apply(kids, ticks(A, N, 2, 'tAN'));
    kids.push.apply(kids, ticks(N, C, 2, 'tNC'));
    kids.push.apply(kids, chevrons(M, N, 1, 'cMN'));
    kids.push.apply(kids, chevrons(B, C, 1, 'cBC'));
    kids.push(VL(A, 'A', 0, -10), VL(B, 'B', -11, 6), VL(C, 'C', 11, 6),
              VL(M, 'M', -13, 2), VL(N, 'N', 13, 2));
    if(RV) kids.push(T(150, 128, 'MN ∥ BC，MN = ½ BC', 'acc'));
    title = '三角形中位線';
    desc = 'M、N 分別是 AB、AC 的中點，線段 MN 與底邊 BC 平行，長度是 BC 的一半。相同記號代表等長，箭頭記號代表平行。';
    cap = '同記號＝等長，箭頭＝平行';
  }
  else if(v === 'area'){
    var H = [150, 168];
    kids.push(poly([A, B, C], 'stk', 'tri'));
    kids.push(seg(A, H, HL ? 'hl' : 'dash', 'ht'));
    kids.push(rightAngle(H, C, A, 10, 'raH'));
    kids.push(T(150, 186, '底', 'acc'), T(163, 105, '高', 'acc', 'start'));
    kids.push(VL(A, 'A', 0, -10), VL(B, 'B', -11, 6), VL(C, 'C', 11, 6));
    title = '三角形的底與高';
    desc = '三角形 ABC 以 BC 為底，從頂點 A 向 BC 作垂線得到高，垂足處有直角記號。';
    cap = '高一定要垂直於所取的底';
  }
  else if(v === 'inequality'){
    kids.push(poly([A, B, C], 'stk', 'tri'));
    kids.push(T(88, 92, 'c', 'lbl', 'end'), T(216, 92, 'b', 'lbl', 'start'), T(154, 186, 'a'));
    kids.push(VL(A, 'A', 0, -10), VL(B, 'B', -11, 6), VL(C, 'C', 11, 6));
    if(HL) kids.push(h('path', {key:'hp', className:'hl',
      d:'M' + B[0] + ' ' + B[1] + ' L' + A[0] + ' ' + A[1] + ' L' + C[0] + ' ' + C[1]}));
    if(RV) kids.push(T(150, 128, 'c + b > a', 'acc'));
    title = '三角形兩邊和大於第三邊';
    desc = '三角形 ABC 的三邊 a、b、c。從 B 沿著 A 再到 C 的折線總長，一定比直接連接 B 到 C 的線段 a 長。';
    cap = '折線 B→A→C 一定比直線 BC 長';
  }
  else if(v === 'equilateral'){
    var E1 = [150, 34], E2 = [58, 168], E3 = [242, 168], Hq = [150, 168];
    kids.push(poly([E1, E2, E3], 'stk', 'tri'));
    kids.push(seg(E1, Hq, HL ? 'hl' : 'dash', 'hh'));
    kids.push(rightAngle(Hq, E3, E1, 10, 'ra'));
    kids.push.apply(kids, ticks(E1, E2, 1, 't1'));
    kids.push.apply(kids, ticks(E1, E3, 1, 't2'));
    kids.push.apply(kids, ticks(E2, E3, 1, 't3'));
    kids.push.apply(kids, ticks(E2, Hq, 2, 't4'));
    kids.push.apply(kids, ticks(Hq, E3, 2, 't5'));
    kids.push(angleArc(E2, E1, E3, 20, 'thin', 'g1'), angleArc(E3, E1, E2, 20, 'thin', 'g2'));
    kids.push(T(92, 96, '邊長', 'sm', 'end'), T(210, 96, '邊長', 'sm', 'start'),
              T(150, 188, '邊長', 'sm'));
    kids.push(T(162, 108, '高', 'acc', 'start'));
    if(RV){
      kids.push(T(150, 14, '高 =（√3 / 2）× 邊長', 'acc'));
      kids.push(T(150, 28, '面積 =（√3 / 4）× 邊長²', 'acc'));
    }
    title = '正三角形的高';
    desc = '正三角形三邊等長（同記號），從頂點作的高把底邊平分成兩段（雙記號），得到兩個 30–60–90 直角三角形。';
    cap = '高把正三角形切成兩個 30°–60°–90° 直角三角形';
  }
  else {   /* bigside：大邊對大角 */
    var A2 = [168, 30], B2 = [40, 168], C2 = [268, 150];
    kids.push(poly([A2, B2, C2], 'stk', 'tri'));
    kids.push.apply(kids, HL ? [h('line', {key:'hb', className:'hl', x1:B2[0], y1:B2[1], x2:C2[0], y2:C2[1]})] : []);
    kids.push(angleArc(A2, B2, C2, HL ? 24 : 20, HL ? 'hl' : 'thin', 'g1'));
    kids.push(angleArc(B2, C2, A2, 20, 'thin', 'g2'));
    kids.push(angleArc(C2, A2, B2, 20, 'thin', 'g3'));
    kids.push(T(96, 88, 'c', 'lbl', 'end'), T(228, 82, 'b', 'lbl', 'start'), T(150, 178, 'a（最長）', 'acc'));
    kids.push(VL(A2, 'A', 0, -10), VL(B2, 'B', -11, 6), VL(C2, 'C', 11, 6));
    if(RV) kids.push(T(150, 122, 'a 最長 ⇒ ∠A 最大', 'acc'));
    title = '大邊對大角';
    desc = '三角形中最長的邊 a 所對的頂角 ∠A 也是最大的角。';
    cap = '最長邊 a 對到的 ∠A 就是最大角';
  }
  return h(Fig, {vb:'0 0 310 200', title:title, desc:desc, caption:cap}, kids);
}

/* ── 2. 平行線截角 ─────────────────────────────────────────────────── */
function ParallelLinesDiagram(p){
  var d = p.data || {}, v = d.variant || 'corresponding', HL = p.highlight, RV = p.reveal;
  var P1 = [120.7, 62], P2 = [179.3, 142];
  var kids = [];
  kids.push(seg([16, 62], [292, 62], 'stk', 'l1'));
  kids.push(seg([16, 142], [292, 142], 'stk', 'l2'));
  kids.push(seg([95, 27], [205, 177], 'stk', 'tr'));
  kids.push.apply(kids, chevrons([40, 62], [120, 62], 1, 'p1'));
  kids.push.apply(kids, chevrons([100, 142], [178, 142], 1, 'p2'));
  kids.push(T(24, 56, 'L₁', 'sm', 'start'), T(24, 136, 'L₂', 'sm', 'start'), T(212, 176, 'M', 'sm', 'start'));
  var upper = [95, 27], lower = [205, 177], leftA = [16, 62], rightA = [292, 62],
      leftB = [16, 142], rightB = [292, 142];
  var pairs = {
    corresponding: [[P1, rightA, lower], [P2, rightB, lower]],
    alternate:     [[P1, rightA, lower], [P2, leftB, upper]],
    cointerior:    [[P1, rightA, lower], [P2, rightB, upper]]
  };
  var pr = pairs[v] || pairs.corresponding;
  kids.push(angleArc(pr[0][0], pr[0][1], pr[0][2], 17, HL ? 'hl' : 'thin', 'q1'));
  kids.push(angleArc(pr[1][0], pr[1][1], pr[1][2], 17, HL ? 'hl' : 'thin', 'q2'));
  kids.push(AL(pr[0][0], pr[0][1], pr[0][2], 29, '①', HL ? 'acc' : 'sm', 'n1'));
  kids.push(AL(pr[1][0], pr[1][1], pr[1][2], 29, '②', HL ? 'acc' : 'sm', 'n2'));
  kids.push(dot(P1, 'dot', 'd1', 2.4), dot(P2, 'dot', 'd2', 2.4));
  var names = {corresponding:'同位角', alternate:'內錯角', cointerior:'同側內角'};
  if(RV) kids.push(T(150, 196, v === 'cointerior' ? '① + ② = 180°' : '① = ②', 'acc'));
  return h(Fig, {vb:'0 0 300 205',
    title:'平行線被截線所截的' + (names[v] || ''),
    desc:'兩條平行線 L₁、L₂（以箭頭記號標示平行）被截線 M 所截，標示出一組' + (names[v] || '') + '①與②。',
    caption:'一組' + (names[v] || '') + '：①與②' + (v === 'cointerior' ? '（互補）' : '（相等）')}, kids);
}

/* ── 3. 全等判定 ───────────────────────────────────────────────────── */
function CongruenceDiagram(p){
  var d = p.data || {}, v = (d.variant || 'SSS').toUpperCase(), HL = p.highlight, RV = p.reveal;
  var kids = [];
  if(v === 'RHS'){
    var A = [42, 28], B = [42, 148], C = [122, 148];
    var D = [212, 28], E = [212, 148], F = [292, 148];
    kids.push(poly([A, B, C], 'stk', 't1'), poly([D, E, F], 'stk', 't2'));
    kids.push(rightAngle(B, A, C, 12, 'r1'), rightAngle(E, D, F, 12, 'r2'));
    kids.push.apply(kids, ticks(A, C, 1, 'h1', HL ? 'hl' : 'thin'));
    kids.push.apply(kids, ticks(D, F, 1, 'h2', HL ? 'hl' : 'thin'));
    kids.push.apply(kids, ticks(B, C, 2, 's1', HL ? 'hl' : 'thin'));
    kids.push.apply(kids, ticks(E, F, 2, 's2', HL ? 'hl' : 'thin'));
    kids.push(VL(A, 'A', -11, 2), VL(B, 'B', -11, 6), VL(C, 'C', 8, 14),
              VL(D, 'D', -11, 2), VL(E, 'E', -11, 6), VL(F, 'F', 8, 14));
    kids.push(T(150, 96, '≅', 'acc'));
    if(RV) kids.push(T(150, 178, '直角＋斜邊＋一股 ⇒ △ABC ≅ △DEF', 'acc'));
    return h(Fig, {vb:'0 0 305 190', title:'RHS 全等判定',
      desc:'兩個直角三角形，直角在 B 與 E；斜邊 AC 與 DF 等長（單記號），一股 BC 與 EF 等長（雙記號）。',
      caption:'RHS：直角、斜邊、一股'}, kids);
  }
  var A1 = [40, 30], B1 = [16, 150], C1 = [126, 150];
  var A2 = [216, 30], B2 = [192, 150], C2 = [302, 150];
  kids.push(poly([A1, B1, C1], 'stk', 't1'), poly([A2, B2, C2], 'stk', 't2'));
  var side = function(P, Q, R, S, n, k){
    kids.push.apply(kids, ticks(P, Q, n, k + 'a', HL ? 'hl' : 'thin'));
    kids.push.apply(kids, ticks(R, S, n, k + 'b', HL ? 'hl' : 'thin'));
  };
  var ang2 = function(V1, X1, Y1, V2, X2, Y2, r, k){
    kids.push(angleArc(V1, X1, Y1, r, HL ? 'hl' : 'thin', k + 'a'));
    kids.push(angleArc(V2, X2, Y2, r, HL ? 'hl' : 'thin', k + 'b'));
  };
  if(v === 'SSS'){
    side(A1, B1, A2, B2, 1, 'u'); side(B1, C1, B2, C2, 2, 'w'); side(A1, C1, A2, C2, 3, 'z');
  } else if(v === 'SAS'){
    side(A1, B1, A2, B2, 1, 'u'); side(A1, C1, A2, C2, 2, 'z');
    ang2(A1, B1, C1, A2, B2, C2, 18, 'g');
  } else if(v === 'ASA'){
    side(B1, C1, B2, C2, 1, 'w');
    ang2(B1, A1, C1, B2, A2, C2, 18, 'g'); ang2(C1, A1, B1, C2, A2, B2, 22, 'g2');
  } else {  /* AAS */
    side(A1, C1, A2, C2, 1, 'z');
    ang2(A1, B1, C1, A2, B2, C2, 18, 'g'); ang2(B1, A1, C1, B2, A2, C2, 22, 'g2');
  }
  kids.push(VL(A1, 'A', 0, -9), VL(B1, 'B', -11, 6), VL(C1, 'C', 10, 12),
            VL(A2, 'D', 0, -9), VL(B2, 'E', -11, 6), VL(C2, 'F', 10, 12));
  kids.push(T(160, 96, '≅', 'acc'));
  if(RV) kids.push(T(160, 182, v + ' ⇒ △ABC ≅ △DEF', 'acc'));
  var descs = {SSS:'三組對應邊分別等長（一、二、三道記號）。',
    SAS:'兩組對應邊等長，且它們夾的角相等。',
    ASA:'兩組對應角相等，且它們夾的邊 BC 與 EF 等長。',
    AAS:'兩組對應角相等，加上一組非夾邊 AC 與 DF 等長。'};
  return h(Fig, {vb:'0 0 320 190', title:v + ' 全等判定',
    desc:'左右兩個三角形 ABC 與 DEF。' + descs[v],
    caption:v + '：相同記號代表對應相等'}, kids);
}

/* ── 5. 特殊直角三角形／勾股定理 ───────────────────────────────────── */

/* ── 座標格線共用 ──────────────────────────────────────────────────── */
function gridAxes(ox, oy, u, xr, yr, kids){
  var i;
  for(i = -xr; i <= xr; i++) kids.push(h('line', {key:'gx' + i, className:'grid',
    x1:fx(ox + i*u), y1:fx(oy - yr*u), x2:fx(ox + i*u), y2:fx(oy + yr*u)}));
  for(i = -yr; i <= yr; i++) kids.push(h('line', {key:'gy' + i, className:'grid',
    x1:fx(ox - xr*u), y1:fx(oy - i*u), x2:fx(ox + xr*u), y2:fx(oy - i*u)}));
  kids.push(h('line', {key:'ax', className:'axis', x1:fx(ox - xr*u), y1:oy, x2:fx(ox + xr*u), y2:oy}));
  kids.push(h('line', {key:'ay', className:'axis', x1:ox, y1:fx(oy - yr*u), x2:ox, y2:fx(oy + yr*u)}));
  kids.push(T(ox + xr*u - 3, oy - 6, 'x', 'lbl', 'end', 'lx'));
  kids.push(T(ox - 7, oy - yr*u + 11, 'y', 'lbl', 'end', 'ly'));
  kids.push(T(ox - 6, oy + 13, 'O', 'lbl', 'end', 'lo'));
}
function fnPath(f, x0, x1, mp, ymin, ymax){
  var segs = [], cur = [], n = 140;
  for(var i = 0; i <= n; i++){
    var x = x0 + (x1 - x0) * i / n, y = f(x);
    if(y >= ymin && y <= ymax){
      var q = mp(x, y);
      cur.push((cur.length ? 'L' : 'M') + fx(q[0]) + ' ' + fx(q[1]));
    } else if(cur.length){ segs.push(cur.join(' ')); cur = []; }
  }
  if(cur.length) segs.push(cur.join(' '));
  return segs.join(' ');
}

/* ══════════════════════════════════════════════════════════════════════
   間隔複習排程與本次練習統計
   全部只在記憶體中運作，不寫入任何儲存空間
   ══════════════════════════════════════════════════════════════════════ */
var ALL_CARDS = ATTACHED.concat(NUM_CARDS, FUNC_CARDS, GEOF_CARDS, GEOP_CARDS);
var CARD_BY_ID = {};
ALL_CARDS.forEach(function(c){ CARD_BY_ID[c.id] = c; });

var METHOD_BY_ID = {};
METHODS.forEach(function(m){ METHOD_BY_ID[m.id] = m; });
/* 知識卡 + 解法卡：兩者都納入間隔複習 */
var ALL_NODES = ALL_CARDS.concat(METHODS);
var NODE_BY_ID = {};
ALL_NODES.forEach(function(n){ NODE_BY_ID[n.id] = n; });

var CATEGORIES = {num:'數與代數', eq:'方程式與函數', geo:'幾何', stat:'統計與機率'};
var GRADES = {7:'七年級', 8:'八年級', 9:'九年級'};
var KINDS = {recall:'公式回想', select:'看題選公式', recognition:'題型辨識',
             application:'公式套用', method:'解法練習'};
var KIND_ORDER = ['recall', 'select', 'recognition', 'application'];
var ERROR_REASONS = [
  {id:'forgot', label:'公式忘記'}, {id:'wrongFormula', label:'選錯公式'},
  {id:'misread', label:'條件看錯'}, {id:'matching', label:'對應邊角找錯'},
  {id:'substitute', label:'代入錯誤'}, {id:'sign', label:'正負號錯誤'},
  {id:'compute', label:'計算錯誤'}, {id:'unit', label:'單位錯誤'}
];
var REASON_LABEL = {};
ERROR_REASONS.forEach(function(r){ REASON_LABEL[r.id] = r.label; });

var LADDER_UNSURE = [1, 3, 7];
var LADDER_KNOWN = [3, 7, 14, 30];
var PROGRESS_VERSION = 2;

function todayStr(d){
  var t = d || new Date();
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') +
         '-' + String(t.getDate()).padStart(2, '0');
}
function addDays(dateStr, n){
  var p = dateStr.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() + n);
  return todayStr(d);
}
function daysBetween(a, b){
  var pa = a.split('-'), pb = b.split('-');
  var da = new Date(Number(pa[0]), Number(pa[1]) - 1, Number(pa[2]));
  var db = new Date(Number(pb[0]), Number(pb[1]) - 1, Number(pb[2]));
  return Math.round((db - da) / 86400000);
}

function emptyCard(){
  return {seen:0, due:null, successDays:[],
    recall:{c:0, t:0}, select:{c:0, t:0}, recognition:{c:0, t:0}, application:{c:0, t:0},
    unsureIdx:0, knownIdx:0, lapses:0, reasons:{}, lastResult:null, lastAt:null};
}
/* 解法卡只有一種題型，所以只留 method 這一個計數桶 */
function emptyMethod(){
  return {seen:0, due:null, successDays:[], method:{c:0, t:0},
    unsureIdx:0, knownIdx:0, lapses:0, reasons:{}, lastResult:null, lastAt:null};
}
function emptyProgress(){
  return {version:PROGRESS_VERSION, cards:{}, methods:{}, recentWrong:[],
    createdAt:todayStr(), updatedAt:todayStr()};
}
function getMP(progress, id){
  if(!progress.methods) progress.methods = {};
  if(!progress.methods[id]) progress.methods[id] = emptyMethod();
  var mp = progress.methods[id];
  if(!mp.method) mp.method = {c:0, t:0};
  if(!mp.successDays) mp.successDays = [];
  if(!mp.reasons) mp.reasons = {};
  return mp;
}
/* 不管是知識卡還是解法卡，都用這個取進度 */
function getNP(progress, id){
  return METHOD_BY_ID[id] ? getMP(progress, id) : getCP(progress, id);
}
function npOf(progress, id){
  return METHOD_BY_ID[id] ? (progress.methods || {})[id] : progress.cards[id];
}
function getCP(progress, id){
  if(!progress.cards[id]) progress.cards[id] = emptyCard();
  var cp = progress.cards[id];
  KIND_ORDER.forEach(function(k){
    if(!cp[k]) cp[k] = {c:0, t:0};
  });
  if(!cp.successDays) cp.successDays = [];
  if(!cp.reasons) cp.reasons = {};
  return cp;
}
/* 熟練條件：不同日期成功回想 ≥ 2、看題選公式答對 ≥ 2、辨識答對 ≥ 1、應用答對 ≥ 2
   「看題選公式」是「背起來但不會用」的那一關，所以和應用題同樣要求 2 次 */
function isMastered(cp, card){
  if(!cp) return false;
  var needSelect = !card || poolFor(card, 'select').length > 0;
  return (cp.successDays || []).length >= 2 &&
         (!needSelect || (cp.select ? cp.select.c : 0) >= 2) &&
         (cp.recognition ? cp.recognition.c : 0) >= 1 &&
         (cp.application ? cp.application.c : 0) >= 2;
}
/* 解法卡：不同日期答對 2 次才算熟練 */
function isMethodMastered(mp){
  if(!mp) return false;
  return (mp.successDays || []).length >= 2 && mp.method.c >= 2;
}
function isNodeMastered(progress, node){
  return METHOD_BY_ID[node.id]
    ? isMethodMastered((progress.methods || {})[node.id])
    : isMastered(progress.cards[node.id], node);
}
function masteryLevel(cp, card){
  if(!cp || cp.seen === 0) return 0;
  return isMastered(cp, card) ? 2 : 1;
}
var MASTERY_LABEL = ['尚未練習', '練習中', '已熟練'];

/* 記錄一次作答 */
function recordAnswer(progress, id, kind, correct, reason){
  var cp = getNP(progress, id), today = todayStr();
  cp.seen++;
  cp[kind].t++;
  if(correct){
    cp[kind].c++;
    if((kind === 'recall' || kind === 'method') && cp.successDays.indexOf(today) < 0)
      cp.successDays.push(today);
  } else {
    cp.lapses++;
    if(reason) cp.reasons[reason] = (cp.reasons[reason] || 0) + 1;
    progress.recentWrong.unshift({id:id, kind:kind, reason:reason || null, date:today});
    progress.recentWrong = progress.recentWrong.slice(0, 30);
  }
  cp.lastResult = correct ? 'ok' : 'miss';
  cp.lastAt = today;
  progress.updatedAt = today;
  return cp;
}
/* 依自評與對錯決定下次複習日 */
function scheduleCard(progress, id, confidence, correct){
  var cp = getNP(progress, id), today = todayStr(), gap;
  if(!correct){
    gap = 1;                       /* 答錯：隔天一定再複習 */
    cp.unsureIdx = 0; cp.knownIdx = 0;
  } else if(confidence === 'no'){
    gap = 1;
    cp.unsureIdx = 0; cp.knownIdx = 0;
  } else if(confidence === 'maybe'){
    gap = LADDER_UNSURE[Math.min(cp.unsureIdx, LADDER_UNSURE.length - 1)];
    cp.unsureIdx = Math.min(cp.unsureIdx + 1, LADDER_UNSURE.length - 1);
    cp.knownIdx = 0;
  } else {
    gap = LADDER_KNOWN[Math.min(cp.knownIdx, LADDER_KNOWN.length - 1)];
    cp.knownIdx = Math.min(cp.knownIdx + 1, LADDER_KNOWN.length - 1);
  }
  cp.due = addDays(today, gap);
  progress.updatedAt = today;
  return gap;
}
/* 下一題該考哪一種形式 */
function pickKind(cp, card){
  /* card 有給的話，題庫是空的那一種就跳過，資料補到一半也不會壞掉 */
  function has(k){ return !card || poolFor(card, k).length > 0; }
  if(!cp || cp.recall.t === 0) return 'recall';
  if(has('select') && cp.select.t === 0) return 'select';
  if(cp.recognition.t === 0) return 'recognition';
  if(cp.application.c < 2) return 'application';
  if(has('select') && cp.select.c < 2) return 'select';
  var arr = KIND_ORDER.filter(has).map(function(k){ return [k, cp[k].t]; });
  arr.sort(function(a, b){ return a[1] - b[1]; });
  return arr[0][0];
}
function dueList(progress, today){
  var t = today || todayStr();
  return ALL_NODES.filter(function(c){
    var cp = npOf(progress, c.id);
    return cp && cp.due && daysBetween(cp.due, t) >= 0;
  });
}
function newList(progress){
  return ALL_NODES.filter(function(c){
    var cp = npOf(progress, c.id);
    return !cp || cp.seen === 0;
  });
}
function shuffle(arr, seed){
  var a = arr.slice(), s = seed || 1;
  for(var i = a.length - 1; i > 0; i--){
    s = (s * 9301 + 49297) % 233280;
    var j = Math.floor(s / 233280 * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* 組出本次練習的題目佇列 */
function buildQueue(progress, opts){
  opts = opts || {};
  var limit = opts.limit || 12, today = todayStr(), pool;
  if(opts.mode === 'free'){
    pool = (opts.cards && opts.cards.length ? opts.cards : ALL_NODES);
    pool = shuffle(pool, Date.now() % 233280).slice(0, limit);
  } else {
    var due = dueList(progress, today).sort(function(a, b){
      return daysBetween(npOf(progress, b.id).due, today) -
             daysBetween(npOf(progress, a.id).due, today);
    });
    pool = due.slice(0, limit);
    if(pool.length < limit){
      var fresh = newList(progress).slice(0, limit - pool.length);
      pool = pool.concat(fresh);
    }
  }
  return pool.map(function(c){
    if(METHOD_BY_ID[c.id]){
      var mp = (progress.methods || {})[c.id];
      return {cardId:c.id, kind:'method', qi:qIndex(mp, 'method'), retry:false};
    }
    var k = pickKind(progress.cards[c.id], c);
    return {cardId:c.id, kind:k, qi:qIndex(progress.cards[c.id], k), retry:false};
  });
}
/* 這張卡這個題型已經作答幾次，就輪到題庫的第幾題 */
function qIndex(cp, kind){
  if(!cp || !cp[kind]) return 0;
  return cp[kind].t;
}
/* 這一題要從卡片的題庫裡拿第幾題 */
function poolFor(card, kind){
  return kind === 'method' ? card.practiceQuestions
       : kind === 'recall' ? [card.recallPrompt]
       : kind === 'select' ? card.selectQuestions
       : kind === 'recognition' ? card.recognitionQuestions
       : card.applicationQuestions;
}
function qFor(card, kind, qi){
  var pool = poolFor(card, kind);
  if(!pool || !pool.length) pool = card.recognitionQuestions || card.practiceQuestions;
  return pool[(qi || 0) % pool.length];
}
/* 最容易忘記的知識點 */
function weakest(progress, n){
  var scored = ALL_CARDS.map(function(c){
    var cp = progress.cards[c.id];
    if(!cp || cp.seen === 0) return null;
    var tot = 0, ok = 0;
    KIND_ORDER.forEach(function(k){ if(cp[k]){ tot += cp[k].t; ok += cp[k].c; } });
    var acc = tot ? ok / tot : 1;
    var score = cp.lapses * 2 + (1 - acc) * 5 + (cp.lastResult === 'miss' ? 2 : 0);
    return score > 0 ? {card:c, score:score, acc:acc, lapses:cp.lapses} : null;
  }).filter(Boolean);
  scored.sort(function(a, b){ return b.score - a.score; });
  return scored.slice(0, n || 3);
}
function kindStats(progress, kind){
  var c = 0, t = 0;
  ALL_CARDS.forEach(function(card){
    var cp = progress.cards[card.id];
    if(cp && cp[kind]){ c += cp[kind].c; t += cp[kind].t; }
  });
  return {c:c, t:t, pct:t ? Math.round(c / t * 100) : null};
}
function categoryStats(progress){
  return Object.keys(CATEGORIES).map(function(k){
    var list = ALL_CARDS.filter(function(c){ return c.category === k; });
    var mastered = list.filter(function(c){ return isMastered(progress.cards[c.id], c); }).length;
    var started = list.filter(function(c){
      var cp = progress.cards[c.id]; return cp && cp.seen > 0;
    }).length;
    return {key:k, name:CATEGORIES[k], total:list.length, mastered:mastered, started:started,
            pct:list.length ? Math.round(mastered / list.length * 100) : 0};
  });
}
function reasonStats(progress){
  var acc = {};
  ALL_CARDS.forEach(function(card){
    var cp = progress.cards[card.id];
    if(cp && cp.reasons) Object.keys(cp.reasons).forEach(function(r){
      acc[r] = (acc[r] || 0) + cp.reasons[r];
    });
  });
  return Object.keys(acc).map(function(r){
    return {id:r, label:REASON_LABEL[r] || r, n:acc[r]};
  }).sort(function(a, b){ return b.n - a.n; });
}

/* ── 練習狀態的查詢輔助 ─────────────────────────────────────────── */
/* 還沒練熟的卡（含完全沒練過的），用來排出下一輪練習 */
function pendingList(progress){
  return ALL_NODES.filter(function(c){ return !isNodeMastered(progress, c); });
}
/* 本次已安排複習間隔的卡，依間隔長短排序（純粹展示間隔複習的安排） */
function scheduleList(progress){
  var today = todayStr();
  return ALL_NODES.filter(function(c){
    var cp = npOf(progress, c.id);
    return cp && cp.due;
  }).map(function(c){
    return {card:c, gap:daysBetween(today, npOf(progress, c.id).due)};
  }).sort(function(a, b){ return a.gap - b.gap; });
}
/* 本次練習的總計（每答一題就即時更新） */
function sessionTotals(progress){
  var n = 0, ok = 0;
  ALL_CARDS.forEach(function(c){
    var cp = progress.cards[c.id];
    if(!cp) return;
    KIND_ORDER.forEach(function(k){ if(cp[k]){ n += cp[k].t; ok += cp[k].c; } });
  });
  Object.keys(progress.methods || {}).forEach(function(id){
    var mp = progress.methods[id];
    if(mp && mp.method){ n += mp.method.t; ok += mp.method.c; }
  });
  return {n:n, ok:ok, pct:n ? Math.round(ok / n * 100) : null};
}

function recordReason(progress, id, reason){
  var cp = getNP(progress, id);
  if(!reason) return;
  cp.reasons[reason] = (cp.reasons[reason] || 0) + 1;
  if(progress.recentWrong.length && progress.recentWrong[0].id === id){
    progress.recentWrong[0].reason = reason;
  }
}

/* ══════════════════════════════════════════════════════════════════════
   進度保存：只寫入這台裝置的瀏覽器本機儲存
   不使用帳號、不連伺服器、不碰檔案；讀寫失敗時退回記憶體並顯示提示
   ══════════════════════════════════════════════════════════════════════ */
var STORAGE_KEY = 'mathCoach.progress.v2';
var STORE_NOTE = {
  local:'進度會存在這台裝置的瀏覽器裡，下次打開可以接著練。換裝置或清除瀏覽器資料就會歸零。',
  memory:'這個瀏覽器不允許保存資料（例如無痕模式），進度只保留在這個分頁。'
};

/* 讀回來的資料一律清洗過：只保留認得的欄位，壞資料不會讓網站當掉 */
function normalizeProgress(raw){
  if(!raw || typeof raw !== 'object') return null;
  var out = emptyProgress();
  out.createdAt = typeof raw.createdAt === 'string' ? raw.createdAt : out.createdAt;
  out.updatedAt = typeof raw.updatedAt === 'string' ? raw.updatedAt : out.updatedAt;
  var cards = (raw.cards && typeof raw.cards === 'object') ? raw.cards : {};
  Object.keys(cards).forEach(function(id){
    if(!CARD_BY_ID[id]) return;
    var c = cards[id] || {}, o = emptyCard();
    o.seen = Math.max(0, Number(c.seen) || 0);
    o.due = (typeof c.due === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(c.due)) ? c.due : null;
    o.successDays = Array.isArray(c.successDays)
      ? c.successDays.filter(function(d){
          return typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
        }).slice(0, 60)
      : [];
    KIND_ORDER.forEach(function(k){
      var s = c[k] || {};
      o[k] = {c:Math.max(0, Number(s.c) || 0), t:Math.max(0, Number(s.t) || 0)};
      if(o[k].c > o[k].t) o[k].c = o[k].t;
    });
    o.unsureIdx = Math.min(Math.max(0, Number(c.unsureIdx) || 0), LADDER_UNSURE.length - 1);
    o.knownIdx = Math.min(Math.max(0, Number(c.knownIdx) || 0), LADDER_KNOWN.length - 1);
    o.lapses = Math.max(0, Number(c.lapses) || 0);
    o.lastResult = (c.lastResult === 'ok' || c.lastResult === 'miss') ? c.lastResult : null;
    o.lastAt = typeof c.lastAt === 'string' ? c.lastAt : null;
    if(c.reasons && typeof c.reasons === 'object'){
      Object.keys(c.reasons).forEach(function(r){
        if(REASON_LABEL[r]) o.reasons[r] = Math.max(0, Number(c.reasons[r]) || 0);
      });
    }
    out.cards[id] = o;
  });
  var meths = (raw.methods && typeof raw.methods === 'object') ? raw.methods : {};
  Object.keys(meths).forEach(function(id){
    if(!METHOD_BY_ID[id]) return;
    var c = meths[id] || {}, o = emptyMethod();
    o.seen = Math.max(0, Number(c.seen) || 0);
    o.due = (typeof c.due === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(c.due)) ? c.due : null;
    o.successDays = Array.isArray(c.successDays)
      ? c.successDays.filter(function(d){
          return typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
        }).slice(0, 60)
      : [];
    var mm = c.method || {};
    o.method = {c:Math.max(0, Number(mm.c) || 0), t:Math.max(0, Number(mm.t) || 0)};
    if(o.method.c > o.method.t) o.method.c = o.method.t;
    o.unsureIdx = Math.min(Math.max(0, Number(c.unsureIdx) || 0), LADDER_UNSURE.length - 1);
    o.knownIdx = Math.min(Math.max(0, Number(c.knownIdx) || 0), LADDER_KNOWN.length - 1);
    o.lapses = Math.max(0, Number(c.lapses) || 0);
    o.lastResult = (c.lastResult === 'ok' || c.lastResult === 'miss') ? c.lastResult : null;
    o.lastAt = typeof c.lastAt === 'string' ? c.lastAt : null;
    if(c.reasons && typeof c.reasons === 'object'){
      Object.keys(c.reasons).forEach(function(r){
        if(REASON_LABEL[r]) o.reasons[r] = Math.max(0, Number(c.reasons[r]) || 0);
      });
    }
    out.methods[id] = o;
  });
  if(Array.isArray(raw.recentWrong)){
    out.recentWrong = raw.recentWrong.filter(function(w){
      return w && NODE_BY_ID[w.id] && KINDS[w.kind];
    }).slice(0, 30).map(function(w){
      return {id:w.id, kind:w.kind,
        reason:REASON_LABEL[w.reason] ? w.reason : null,
        date:(typeof w.date === 'string') ? w.date : ''};
    });
  }
  return out;
}

var Store = {
  mode:'memory', note:null, timer:null,
  load:function(){
    var raw = null;
    try { raw = window.localStorage.getItem(STORAGE_KEY); }
    catch(e){ this.mode = 'memory'; this.note = STORE_NOTE.memory; return emptyProgress(); }
    this.mode = 'local'; this.note = null;
    if(!raw) return emptyProgress();
    var parsed = null;
    try { parsed = JSON.parse(raw); } catch(e){ parsed = null; }
    var clean = normalizeProgress(parsed);
    if(!clean){
      this.note = '上次的進度讀不回來（資料毀損），已從頭開始。';
      return emptyProgress();
    }
    return clean;
  },
  save:function(data, onStatus){
    var self = this;
    if(self.timer) clearTimeout(self.timer);
    self.timer = setTimeout(function(){
      var before = self.mode;
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        self.mode = 'local'; self.note = null;
      } catch(e){
        self.mode = 'memory';
        self.note = (e && e.name === 'QuotaExceededError')
          ? '瀏覽器儲存空間已滿，進度只保留在這個分頁。'
          : STORE_NOTE.memory;
      }
      if(before !== self.mode && onStatus) onStatus(self.mode, self.note);
    }, 400);
  },
  clear:function(){
    try { window.localStorage.removeItem(STORAGE_KEY); } catch(e){}
  }
};

/* ── 作答元件：公式積木填空 ────────────────────────────────────────
   空格交給數學排版器渲染，所以放在分數的分子分母、根號內或指數位置
   都能正確顯示。                                                      */
function blanksOk(q, filled){
  if(q.anyOrder){
    var a = filled.slice().sort(), b = q.blanks.slice().sort();
    return a.length === b.length && a.every(function(v, i){ return v === b[i]; });
  }
  return filled.every(function(v, i){ return v === q.blanks[i]; });
}
/* 個別空格是否正確：可互換的題目只要答案在正解集合裡就算對 */
function blankState(q, filled, i){
  if(!q.anyOrder) return filled[i] === q.blanks[i];
  var pool = q.blanks.slice();
  for(var j = 0; j < filled.length; j++){
    if(j === i) continue;
    var at = pool.indexOf(filled[j]);
    if(at >= 0) pool.splice(at, 1);
  }
  return pool.indexOf(filled[i]) >= 0;
}
function BlankAnswer(props){
  var q = props.q, filled = props.filled, locked = props.locked, active = props.active;
  var src = String(q.template).replace(/@(\d+)/g, function(_m, n){ return '\\blank{' + n + '}'; });
  function slot(n, key){
    var bi = n - 1, val = filled[bi];
    var state = locked ? (blankState(q, filled, bi) ? 'ok' : 'bad')
                       : (active === bi ? 'active' : (val ? 'filled' : ''));
    return h('button', {key:key, type:'button', className:cx('blank', state), disabled:locked,
      'aria-label':'第 ' + n + ' 個空格' + (val ? '，已填入答案' : '，尚未填入'),
      onClick:function(){ props.onBlankClick(bi); }},
      val ? h(M, {t:val}) : '？');
  }
  /* 同一塊積木可能要用在兩個空格（例如加權平均的分子分母都是「次數」），
     所以要用「這張卡需要幾塊」而不是「用過就不能再用」來決定是否停用。 */
  var needCount = {};
  q.blanks.forEach(function(b){ needCount[b] = (needCount[b] || 0) + 1; });
  var usedCount = {};
  filled.forEach(function(v){ if(v) usedCount[v] = (usedCount[v] || 0) + 1; });
  function spent(tok){ return (usedCount[tok] || 0) >= (needCount[tok] || 1); }
  var repeated = Object.keys(needCount).some(function(k){ return needCount[k] > 1; });
  return h('div', null,
    h('div', {className:'mwrap'}, h(M, {t:src, block:true, slots:slot})),
    locked ? null : h('div', null,
      h('div', {className:'eyebrow', style:{marginTop:'8px'}}, '公式積木'),
      h('div', {className:'bank'}, q.bank.map(function(tok, i){
        var left = (needCount[tok] || 1) - (usedCount[tok] || 0);
        return h('button', {key:i, type:'button',
          className:cx('token', spent(tok) ? 'used' : ''),
          'aria-label':needCount[tok] > 1 ? '公式積木，這一塊還要再用 ' + left + ' 次' : null,
          onClick:function(){ props.onToken(tok); }},
          h(M, {t:tok}),
          needCount[tok] > 1 && left > 0
            ? h('span', {className:'x2'}, '×' + left) : null);
      }))),
    q.anyOrder && !locked
      ? h('div', {className:'tiny muted', style:{marginTop:'6px'}}, '兩個空格的順序可以互換。')
      : null,
    repeated && !locked
      ? h('div', {className:'tiny muted', style:{marginTop:'6px'}}, '同一塊積木可以重複使用，右上角的數字是還要再用幾次。')
      : null);
}

/* ── 作答元件：選項 ────────────────────────────────────────────────── */
var OPT_KEYS = ['A', 'B', 'C', 'D'];
function ChoiceAnswer(props){
  var q = props.q, picked = props.picked, locked = props.locked;
  return h('div', {role:'group', 'aria-label':'選項'}, q.options.map(function(o, i){
    var state = '';
    if(locked){
      if(i === q.answer) state = 'ok';
      else if(i === picked) state = 'bad';
    }
    return h('button', {key:i, type:'button', className:cx('opt', state),
      'aria-pressed':picked === i, disabled:locked,
      onClick:function(){ props.onPick(i); }},
      h('span', {className:'key'}, OPT_KEYS[i]),
      h('span', {style:{flex:1}}, o.math ? h(M, {t:o.math}) : o.t),
      locked && i === q.answer ? h('span', {className:'mark'}, '✓ 正解') : null,
      locked && i === picked && i !== q.answer ? h('span', {className:'mark'}, '✕ 你選的') : null);
  }));
}

/* ── 作答元件：數字鍵盤 ────────────────────────────────────────────── */
var PAD = ['7', '8', '9', '⌫', '4', '5', '6', '−', '1', '2', '3', '.', '0', '清除'];
function NumericAnswer(props){
  var val = props.value, locked = props.locked;
  function press(k){
    if(locked) return;
    if(k === '⌫') props.onChange(val.slice(0, -1));
    else if(k === '清除') props.onChange('');
    else if(k === '−') props.onChange(val.indexOf('-') === 0 ? val.slice(1) : '-' + val);
    else props.onChange(val + k);
  }
  return h('div', null,
    h('div', {className:'numview'},
      h('span', {style:{fontFamily:'"IBM Plex Mono",monospace', fontSize:'20px',
        fontVariantNumeric:'tabular-nums'}},
        val ? val.replace(/-/g, '−') : '　'),
      props.unit ? h('span', {className:'muted small', style:{marginLeft:'6px'}}, props.unit) : null),
    locked ? null : h('div', {className:'keypad'}, PAD.map(function(k){
      return h('button', {key:k, type:'button', onClick:function(){ press(k); },
        'aria-label':k === '⌫' ? '刪除一個字' : k,
        style:k === '清除' ? {gridColumn:'span 3'} : null}, k);
    })));
}
function numEq(a, b){
  var na = parseFloat(String(a).replace(/−/g, '-')), nb = parseFloat(String(b).replace(/−/g, '-'));
  if(!isNaN(na) && !isNaN(nb)) return Math.abs(na - nb) < 1e-9;
  return String(a).trim() === String(b).trim();
}

function renderAnswer(q){
  if(q.type === 'numeric'){
    return h('b', null, String(q.answer).replace(/-/g, '−') + (q.unit ? ' ' + q.unit : ''));
  }
  if(q.options && q.options[q.answer]){
    var o = q.options[q.answer];
    return h('span', null,
      h('b', null, OPT_KEYS[q.answer] + '　'),
      o.math ? h(M, {t:o.math}) : h('b', null, o.t),
      q.unit ? h('span', null, ' ' + q.unit) : null);
  }
  return h('b', null, '—');
}

/* ── 練習流程 ─────────────────────────────────────────────────────── */
function SessionView(props){
  var st = props.state, item = st.queue[st.idx], card = NODE_BY_ID[item.cardId];
  var kind = item.kind;
  /* 依題庫索引取題：同一張卡重複練習時會輪到下一題 */
  var q = qFor(card, kind, item.qi);
  var locked = st.phase !== 'answer';
  /* 回想與看題選公式：作答時不能先看到圖，否則等於直接告訴他是哪一張卡 */
  var blind = (kind === 'recall' || kind === 'select');
  var isMethod = (kind === 'method');
  var canSubmit = q.type === 'blank' ? st.filled.every(function(v){ return !!v; })
                : q.type === 'numeric' ? st.num.length > 0
                : st.picked !== null;

  function submit(){
    var correct;
    if(q.type === 'blank') correct = blanksOk(q, st.filled);
    else if(q.type === 'numeric') correct = numEq(st.num, q.answer);
    else correct = st.picked === q.answer;
    props.onSubmit(correct);
  }

  var head = h('div', null,
    h('div', {className:'progressline', role:'progressbar',
      'aria-valuenow':st.idx + 1, 'aria-valuemin':1, 'aria-valuemax':st.queue.length,
      'aria-label':'練習進度'},
      st.queue.map(function(item, i){
        var cls = i < st.idx ? (st.results[i] === false ? 'miss' : 'done') : (i === st.idx ? 'now' : '');
        return h('i', {key:i, className:cls});
      })),
    h('div', {style:{display:'flex', alignItems:'baseline', gap:'8px', marginBottom:'6px'}},
      h('span', {className:'eyebrow'}, KINDS[kind]),
      h('span', {className:'tiny muted', style:{marginLeft:'auto'}},
        (st.idx + 1) + ' / ' + st.queue.length),
      h('button', {className:'tiny muted', style:{textDecoration:'underline'},
        onClick:props.onQuit}, '結束')),
    st.queue[st.idx].retry
      ? h('div', {className:'banner', style:{marginBottom:'10px'}},
          h('span', null, '↻'), h('span', null, '這張剛才答錯了，再練一次。'))
      : null);

  /* ① 作答狀態：不顯示公式與答案 */
  if(st.phase === 'answer' || st.phase === 'reason'){
    return h('div', null, head,
      h('div', {className:'panel'},
        h('h3', null, q.prompt),
        card.diagramType && !blind
          ? h('div', {style:{marginTop:'10px'}},
              h(DiagramSlot, {type:card.diagramType, data:card.diagramData,
                highlight:st.hint >= 2, reveal:false}))
          : (card.diagramType && st.hint >= 2
              ? h('div', {style:{marginTop:'10px'}},
                  h(DiagramSlot, {type:card.diagramType, data:card.diagramData,
                    highlight:true, reveal:false}))
              : null),
        q.given ? h(MB, {t:q.given}) : null,
        h('div', null,
          q.type === 'blank'
            ? h(BlankAnswer, {q:q, filled:st.filled, active:st.active, locked:locked,
                onBlankClick:props.onBlankClick, onToken:props.onToken})
            : q.type === 'numeric'
              ? h(NumericAnswer, {value:st.num, unit:q.unit, locked:locked, onChange:props.onNum})
              : h(ChoiceAnswer, {q:q, picked:st.picked, locked:locked, onPick:props.onPick}))),
      st.hint >= 1 ? h('div', {className:'banner', style:{marginTop:'10px'}},
        h('span', {'aria-hidden':'true'}, '①'),
        h('span', null, h('b', null, '提示一（使用時機）：'),
          q.hint1 || (isMethod ? card.clues.join('；') : card.usageConditions))) : null,
      st.hint >= 2 ? h('div', {className:'banner teal', style:{marginTop:'8px'}},
        h('span', {'aria-hidden':'true'}, '②'),
        h('span', null, h('b', null, '提示二：'),
          isMethod ? ('第一步 ── ' + card.steps[0])
          : kind === 'select'
            ? ('這種題目的關鍵字 ── ' + card.triggerWords.join('、'))
            : card.diagramType ? '圖上已用琥珀色粗線標出要用到的邊、角或弧。'
                               : ('關鍵符號 ── ' + card.variables.map(function(v){
                                   return v.sym + '：' + v.desc; }).join('；')))) : null,
      st.phase === 'reason'
        ? h('div', null,
            h('div', {className:'banner red', style:{marginTop:'14px'}},
              h('span', {'aria-hidden':'true'}, '✕'),
              h('span', null, '這題答錯了。選一個最主要的原因，之後會幫你追蹤。')),
            h('div', {className:'chips', style:{marginTop:'10px'}}, ERROR_REASONS.map(function(r){
              return h('button', {key:r.id, className:'chip', type:'button',
                'aria-pressed':st.reason === r.id,
                onClick:function(){ props.onReason(r.id); }}, r.label);
            })),
            h('div', {className:'actionbar'},
              h('button', {className:'btn primary', disabled:!st.reason, onClick:props.onToExplain},
                '看解析')))
        : h('div', {className:'actionbar'},
            st.hint < 2
              ? h('button', {className:'btn ghost', onClick:props.onHint},
                  st.hint === 0 ? '提示' : '再一個提示')
              : null,
            h('button', {className:'btn primary', disabled:!canSubmit, onClick:submit}, '送出答案')));
  }

  /* ② 解析狀態 */
  var correct = st.results[st.idx];
  var banner = h('div', {className:cx('banner', correct ? 'teal' : 'red')},
    h('span', {'aria-hidden':'true'}, correct ? '✓' : '✕'),
    h('span', null, correct ? '答對了。'
      : ('答錯了' + (st.reason ? '（' + REASON_LABEL[st.reason] + '）' : '') + '，看完解析再判斷熟悉度。')));

            h('ul', {className:'plain small'}, card.check.map(function(x, i){
              return h('li', {key:i}, x);
            }))))),
      confidence);
  }

  /* 主角是「這一題為什麼這樣解」，其餘收進一個摺疊 */

/* ── 今日複習 ─────────────────────────────────────────────────────── */
function HomeScreen(props){
  var p = props.progress;
  var due = dueList(p);
  var pending = pendingList(p);
  var weak = weakest(p, 3);
  var totals = sessionTotals(p);
  var total = ALL_NODES.length;
  var mastered = total - pending.length;
  var planned = Math.min(12, due.length || Math.min(8, pending.length));
  var mins = Math.max(1, Math.round(planned * 25 / 60));
  var startedToday = totals.n > 0;

  return h('div', null,
    /* ① 今天要做什麼 —— 整個畫面的主角，其餘都在它下面 */
    h('div', {className:'todo'},
      h('div', {className:'todo-head'},
        h('span', {className:'eyebrow'}, '今天的複習'),
        h('span', {className:'eyebrow'}, todayStr())),
      due.length > 0
        ? h('div', {className:'todo-lead'},
            h('div', {className:'big'}, due.length),
            h('div', null,
              h('div', {style:{fontWeight:700}}, '張卡今天到期'),
              h('div', {className:'tiny muted'}, '這輪 ' + planned + ' 題，約 ' + mins + ' 分鐘')))
        : h('div', {className:'todo-lead'},
            h('div', {className:'big'}, Math.min(12, pending.length) || '✓'),
            h('div', null,
              h('div', {style:{fontWeight:700}},
                pending.length ? '張還沒練熟的卡' : '全部練熟了'),
              h('div', {className:'tiny muted'},
                pending.length
                  ? '今天沒有到期的，先認識新的公式與解法'
                  : '可以隨機抽考自己，或等下一批複習到期'))),
      h('button', {className:'btn primary', onClick:function(){ props.onStart('due'); },
        disabled:pending.length === 0 && due.length === 0},
        due.length > 0 ? '開始複習' : (pending.length ? '開始練習' : '今天沒有待辦')),
      h('button', {className:'btn ghost', onClick:function(){ props.onStart('free'); }},
        '隨機抽考')),

    /* ② 一條線說完整體進度 */
    h('div', {className:'panel', style:{marginTop:'18px'}},
      h('div', {className:'kv', style:{border:'none', padding:0}},
        h('span', {className:'small'}, '已練熟'),
        h('b', null, mastered + ' / ' + total)),
      h('div', {className:'progressbar'},
        h('i', {style:{width:Math.round(mastered / total * 100) + '%'}})),
      h('div', {className:'tiny muted'},
        '公式與性質 ' + ALL_CARDS.length + ' 張、常用解法 ' + METHODS.length + ' 張' +
        (startedToday ? ('　·　累計答對 ' + totals.ok + ' / ' + totals.n +
          (totals.pct === null ? '' : '（' + totals.pct + '%）')) : ''))),

    /* ③ 有錯題才長出來 */
    weak.length
      ? h('div', {className:'panel'},
          h('h3', null, '最容易忘記'),
          h('div', {className:'stack-s'}, weak.map(function(w){
            var cp = p.cards[w.card.id];
            return h('button', {key:w.card.id, className:'row',
              style:{marginBottom:0},
              onClick:function(){ props.onOpenCard(w.card.id); }},
              h('div', {className:'rtop'},
                h('span', {className:'rtitle'}, w.card.title),
                h('span', {className:'tag red'}, '錯 ' + cp.lapses + ' 次')),
              h('div', {className:'rmeta'},
                h('span', null, CATEGORIES[w.card.category]),
                h('span', null, '正確率 ' + Math.round(w.acc * 100) + '%')));
          })))
      : null,

    props.storeNote
      ? h('p', {className:'emptyline', style:{marginTop:'18px'}}, props.storeNote)
      : null,

    /* ④ 進度細節收在同一頁的底部，不再另開一個分頁 */
    h('details', {className:'more'},
      h('summary', null, '看詳細進度與錯題'),
      h(ProgressPanel, {progress:p, onOpenCard:props.onOpenCard,
        onOpenMethod:props.onOpenMethod, storeMode:props.storeMode,
        onReset:props.onReset})));

var CARD_FILTERS = [

  var p = props.progress;
  var KINDS_SHOWN = [['recall', '公式回想'], ['select', '看題選公式'],
                     ['recognition', '題型辨識'], ['application', '公式套用']];
  var stats = KINDS_SHOWN.map(function(k){ return [k[1], kindStats(p, k[0])]; });
  var sel = kindStats(p, 'select');
  var cats = categoryStats(p), reasons = reasonStats(p);
  var plan = scheduleList(p);
  var totals = sessionTotals(p);
  var maxReason = reasons.length ? reasons[0].n : 1;

  if(totals.n === 0){
    return h('div', {className:'morebody'},
      h('p', {className:'small muted'},
        '練過一輪之後，這裡會長出四項熟練指標、各章節進度、最常卡住的原因，' +
        '以及每張卡的下次複習時間。'),
      h('p', {className:'small muted'}, STORE_NOTE[props.storeMode] +
        '進度只留在這台裝置，不會上傳，也沒有人能從別的裝置看到。'),
      h('button', {className:'btn danger', onClick:props.onReset}, '重設全部進度'));
  }

  return h('div', {className:'morebody'},
    h('div', {className:'eyebrow'}, '四項熟練指標　·　累計 ' + totals.n + ' 題'),
    h('div', {className:'statgrid'}, stats.map(function(x){
      var st = x[1];
      return h('div', {key:x[0]},
        h('span', {className:cx('n', st.pct === null ? 'none' : (st.pct < 60 ? 'weak' : ''))},
          st.pct === null ? '—' : st.pct + '%'),
        h('span', {className:'l'}, x[0] + (st.t ? '　' + st.c + '/' + st.t : '')));
    })),
    sel.t >= 5 && sel.pct !== null && sel.pct < 60
      ? h('div', {className:'banner', style:{marginTop:'10px'}},
          h('span', {'aria-hidden':'true'}, '🔑'),
          h('span', null, '「看題選公式」偏低代表公式背得起來、但看到題目想不到要用哪一條。' +
            '先把這一項練上來，應用題會跟著變順。'))
      : null,

    h('div', {className:'eyebrow', style:{marginTop:'6px'}}, '各章節熟練度'),
    h('div', {className:'stack-s'}, cats.map(function(c){
      return h('div', {key:c.key, className:'catrow'},
        h('span', {className:'catname'}, c.name),
        h('span', {className:'catnum'}, c.mastered + ' / ' + c.total),
        h('span', {className:'progressbar'}, h('i', {style:{width:c.pct + '%'}})));
    })),

    /* ③ 以下都只在有資料時才出現 */
    reasons.length
      ? h('div', {className:'panel', style:{marginTop:'20px'}},
          h('h3', null, '最常卡住的地方'),
          h('div', {className:'stack-s'}, reasons.slice(0, 5).map(function(r){
            return h('div', {key:r.id, className:'catrow'},
              h('span', {className:'catname'}, r.label),
              h('span', {className:'catnum'}, r.n + ' 次'),
              h('span', {className:'progressbar'},
                h('i', {className:'warn',
                  style:{width:Math.round(r.n / maxReason * 100) + '%'}})));
          })))
      : null,

    p.recentWrong.length
      ? h('div', {className:'panel'},
          h('h3', null, '最近錯題'),
          h('div', {className:'stack-s'}, p.recentWrong.slice(0, 6).map(function(w, i){
            var c = NODE_BY_ID[w.id];
            return h('button', {key:i, className:'row', style:{marginBottom:0},
              onClick:function(){ METHOD_BY_ID[w.id] ? props.onOpenMethod(w.id)
                                                     : props.onOpenCard(w.id); }},
              h('div', {className:'rtop'},
                h('span', {className:'rtitle'}, c.title),
                h('span', {className:'tag'}, KINDS[w.kind])),
              w.reason
                ? h('div', {className:'rmeta'}, h('span', {className:'tag red'}, REASON_LABEL[w.reason]))
                : null);
          })))
      : null,

    plan.length
      ? h('div', {className:'panel'},
          h('h3', null, '接下來的複習'),
          h('p', {className:'tiny muted'}, '到期當天首頁就會提醒你。'),
          h('div', {className:'stack-s'}, plan.slice(0, 8).map(function(it){
            return h('button', {key:it.card.id, className:'row', style:{marginBottom:0},
              onClick:function(){ METHOD_BY_ID[it.card.id] ? props.onOpenMethod(it.card.id)
                                                           : props.onOpenCard(it.card.id); }},
              h('div', {className:'rtop'},
                h('span', {className:'rtitle'}, it.card.title),
                h('span', {className:'tag ' + (it.gap <= 1 ? 'red' : it.gap <= 7 ? 'amber' : 'teal')},
                  it.gap <= 0 ? '今天' : it.gap + ' 天後')));
          })),
          plan.length > 8
            ? h('p', {className:'emptyline'}, '還有 ' + (plan.length - 8) + ' 張未列出。')
            : null)
      : null,

    h('div', {className:'stack-s', style:{marginTop:'6px'}},
          h('div', {className:'kv'}, h('span', null, '累計已練題數'), h('b', null, totals.n)),
          h('div', {className:'kv'}, h('span', null, '答對 / 答錯'),
            h('b', null, totals.ok + ' / ' + (totals.n - totals.ok))),
          h('div', {className:'kv'}, h('span', null, '正確率'),
            h('b', null, totals.pct === null ? '—' : totals.pct + '%')),
      h('div', {className:'kv'}, h('span', null, '最後更新'), h('b', null, p.updatedAt))),
    h('p', {className:'small muted'}, STORE_NOTE[props.storeMode] +
      '進度只留在這台裝置，不會上傳，也沒有人能從別的裝置看到。'),
    h('button', {className:'btn danger', onClick:props.onReset}, '重設全部進度'));
}

/* ── 應用程式根元件 ───────────────────────────────────────────────── */
function makeSlot(queue, idx, results){
  var item = queue[idx], q = qFor(NODE_BY_ID[item.cardId], item.kind, item.qi);
  return {queue:queue, idx:idx, phase:'answer', hint:0,
    filled:q.type === 'blank' ? q.blanks.map(function(){ return null; }) : [],
    active:0, picked:null, num:'', reason:null, results:results || []};
}

function App(){
  /* 進度存在這台裝置的瀏覽器本機儲存，不經過帳號或伺服器 */
  var boot = useRef(null);
  if(!boot.current) boot.current = Store.load();
  var pState = useState(boot.current), progress = pState[0], setProgress = pState[1];
  var progressRef = useRef(progress);
  var smState = useState(Store.mode), storeMode = smState[0], setStoreMode = smState[1];
  var snState = useState(Store.note), storeNote = snState[0], setStoreNote = snState[1];
  var tState = useState('practice'), tab = tState[0], setTab = tState[1];
  var cfState = useState('todo'), cardFilter = cfState[0], setCardFilter = cfState[1];
  var qState = useState(''), query = qState[0], setQuery = qState[1];
  var sState = useState(null), session = sState[0], setSession = sState[1];
  var cState = useState(null), openCard = cState[0], setOpenCard = cState[1];
  var oState = useState(null), openMethod = oState[0], setOpenMethod = oState[1];
  var dState = useState(null), dialog = dState[0], setDialog = dState[1];
  var toastState = useState(null), toast = toastState[0], setToast = toastState[1];

  useEffect(function(){
    if(!toast) return;
    var t = setTimeout(function(){ setToast(null); }, 3200);
    return function(){ clearTimeout(t); };
  }, [toast]);
  useEffect(function(){ window.scrollTo(0, 0); }, [tab, session ? session.idx : -1]);

  function onStoreStatus(mode, note){ setStoreMode(mode); setStoreNote(note); }
  function update(mutator){
    var next = JSON.parse(JSON.stringify(progressRef.current));
    mutator(next);
    progressRef.current = next;
    setProgress(next);
    Store.save(next, onStoreStatus);
  }
  function replaceProgress(next){
    progressRef.current = next;
    setProgress(next);
    Store.save(next, onStoreStatus);
  }
  function startSession(mode, cards){
    var queue = buildQueue(progressRef.current, {mode:mode, cards:cards, limit:12});
    if(!queue.length){ setToast('目前沒有可以練習的卡片。'); return; }
    setOpenCard(null); setOpenMethod(null);
    setSession(makeSlot(queue, 0, []));
  }
  function practiceOne(node){
    setOpenCard(null); setOpenMethod(null);
    if(METHOD_BY_ID[node.id]){
      var mp = (progressRef.current.methods || {})[node.id];
      setSession(makeSlot([{cardId:node.id, kind:'method',
        qi:qIndex(mp, 'method'), retry:false}], 0, []));
      return;
    }
    var k = pickKind(progressRef.current.cards[node.id], node);
    setSession(makeSlot([{cardId:node.id, kind:k,
      qi:qIndex(progressRef.current.cards[node.id], k), retry:false}], 0, []));
  }

  var cur = session && session.phase !== 'done' ? session.queue[session.idx] : null;

  function onSubmit(correct){
    update(function(p){ recordAnswer(p, cur.cardId, cur.kind, correct, null); });
    setSession(function(s){
      var r = s.results.slice(); r[s.idx] = correct;
      return Object.assign({}, s, {results:r, phase:correct ? 'explain' : 'reason'});
    });
  }
  function onToExplain(){
    var reason = session.reason;
    update(function(p){ recordReason(p, cur.cardId, reason); });
    setSession(function(s){ return Object.assign({}, s, {phase:'explain'}); });
  }
  function onConfidence(conf){
    var s = session, correct = s.results[s.idx];
    var queue = s.queue.slice();
    if(correct === false && !queue[s.idx].retry){
      queue.splice(Math.min(s.idx + 3, queue.length), 0,
        {cardId:queue[s.idx].cardId, kind:queue[s.idx].kind, qi:queue[s.idx].qi, retry:true});
    }
    var nextIdx = s.idx + 1, done = nextIdx >= queue.length;
    update(function(p){ scheduleCard(p, s.queue[s.idx].cardId, conf, correct); });
    setSession(done ? Object.assign({}, s, {queue:queue, phase:'done'})
                    : makeSlot(queue, nextIdx, s.results));
  }
  function onBlankClick(bi){
    setSession(function(s){
      var f = s.filled.slice();
      if(f[bi]){ f[bi] = null; return Object.assign({}, s, {filled:f, active:bi}); }
      return Object.assign({}, s, {active:bi});
    });
  }
  function onToken(tok){
    setSession(function(s){
      var f = s.filled.slice();
      var i = f[s.active] ? f.indexOf(null) : s.active;
      if(i < 0) i = s.active;
      f[i] = tok;
      var nextEmpty = f.indexOf(null);
      return Object.assign({}, s, {filled:f, active:nextEmpty < 0 ? i : nextEmpty});
    });
  }

  var pendingCount = pendingList(progress).length;
  var sessionSummary = null;
  if(session && session.phase === 'done'){
    var n = session.results.length;
    var ok = session.results.filter(function(x){ return x === true; }).length;
    sessionSummary = {n:n, ok:ok, miss:n - ok};
  }

  var body;
  if(session && session.phase === 'done'){
    body = h('div', null,
      h(SectionHead, {title:'這一輪結束'}),
      h('div', {className:'block'},
        h('div', {style:{display:'flex', gap:'16px', alignItems:'flex-end'}},
          h('div', null, h('div', {className:'big'}, sessionSummary.ok + '/' + sessionSummary.n),
            h('div', {className:'tiny muted'}, '答對題數')),
          h('div', {style:{marginLeft:'auto', textAlign:'right'}},
            h('div', {className:'big', style:{fontSize:'22px'}}, sessionSummary.miss),
            h('div', {className:'tiny muted'}, '答錯（已排到明天）'))),
        h('p', {className:'small muted', style:{marginTop:'12px'}},
          '答錯的卡已經自動排進明天的複習清單；自評「還不確定」的卡會在 1、3、7 天後再出現。'),
        h('div', {className:'btnrow'},
          h('button', {className:'btn primary', onClick:function(){
            setSession(null); setTab('home');
          }}, '回到練習')),
        h('div', {className:'btnrow'},
          h('button', {className:'btn ghost', onClick:function(){
            setSession(null); startSession('due');
          }}, '再練一輪'))));
  } else if(session){
    body = h(SessionView, {state:session,
      onSubmit:onSubmit, onToExplain:onToExplain, onConfidence:onConfidence,
      onBlankClick:onBlankClick, onToken:onToken,
      onPick:function(i){ setSession(function(s){ return Object.assign({}, s, {picked:i}); }); },
      onNum:function(v){ setSession(function(s){ return Object.assign({}, s, {num:v}); }); },
      onHint:function(){ setSession(function(s){ return Object.assign({}, s, {hint:Math.min(2, s.hint + 1)}); }); },
      onReason:function(r){ setSession(function(s){ return Object.assign({}, s, {reason:r}); }); },
      onQuit:function(){ setSession(null); }});
  } else if(tab === 'cards'){
    body = h(CardsScreen, {progress:progress, filter:cardFilter, onFilter:setCardFilter,
      query:query, onQuery:setQuery,
      onOpenCard:setOpenCard, onOpenMethod:setOpenMethod});
  } else {
    body = h(HomeScreen, {progress:progress, onStart:startSession,
      onOpenCard:setOpenCard, onOpenMethod:setOpenMethod, storeNote:storeNote,
      storeMode:storeMode, onReset:function(){ setDialog('reset1'); }});
  }

  var cardObj = openCard ? CARD_BY_ID[openCard] : null;
  var methodObj = openMethod ? METHOD_BY_ID[openMethod] : null;

  return h('div', {className:'app'},
    h('header', {className:'topbar'},
      h('h1', null, '會考數學公式教練'),
      h('span', {className:'sub'}, session ? 'PRACTICE'
        : (storeMode === 'local' ? '進度已保存' : '未保存'))),
    h('main', {className:'main'}, body),
    session ? null : h(BottomNav, {tab:tab, onTab:setTab}),
    toast ? h('div', {style:{position:'fixed', left:0, right:0, bottom:'70px', zIndex:50,
        display:'flex', justifyContent:'center', pointerEvents:'none'}},
        h('div', {className:'banner teal', style:{maxWidth:'400px'}},
          h('span', {'aria-hidden':'true'}, 'ⓘ'), h('span', null, toast))) : null,
    cardObj ? h(Sheet, {title:cardObj.title, onClose:function(){ setOpenCard(null); }},
      h(CardDetail, {card:cardObj, progress:progress, onPractice:practiceOne})) : null,
    methodObj ? h(Sheet, {title:methodObj.title, onClose:function(){ setOpenMethod(null); }},
      h(MethodDetail, {m:methodObj, progress:progress, onPractice:practiceOne})) : null,
    dialog === 'reset1' ? h(Modal, {title:'要重設全部進度嗎？', onClose:function(){ setDialog(null); }},
      h('p', {className:'small'}, '這會清除這台裝置上所有的作答紀錄、熟練度與複習排程，而且無法復原。'),
      h('div', {className:'btnrow'},
        h('button', {className:'btn ghost', onClick:function(){ setDialog(null); }}, '取消'),
        h('button', {className:'btn danger', onClick:function(){ setDialog('reset2'); }}, '繼續'))) : null,
    dialog === 'reset2' ? h(Modal, {title:'最後確認', onClose:function(){ setDialog(null); }},
      h('div', {className:'banner red', style:{marginBottom:'10px'}},
        h('span', {'aria-hidden':'true'}, '！'),
        h('span', null, '按下「確定重設」後，' + Object.keys(progress.cards).length +
          ' 張卡的紀錄會全部歸零，而且無法復原。')),
      h('div', {className:'btnrow'},
        h('button', {className:'btn ghost', onClick:function(){ setDialog(null); }}, '不要重設'),
        h('button', {className:'btn danger', onClick:function(){
          Store.clear();
          replaceProgress(emptyProgress()); setDialog(null); setSession(null);
          setToast('進度已全部重設。');
        }}, '確定重設'))) : null);
}

/* ── 掛載 ─────────────────────────────────────────────────────────── */
var Boundary = (function(){
  function B(p){ React.Component.call(this, p); this.state = {err:null}; }
  B.prototype = Object.create(React.Component.prototype);
  B.prototype.constructor = B;
  B.getDerivedStateFromError = function(err){ return {err:err}; };
  B.prototype.componentDidCatch = function(){};
  B.prototype.render = function(){
    if(this.state.err){
      return h('div', {className:'app'},
        h('header', {className:'topbar'}, h('h1', null, '會考數學公式教練')),
        h('main', {className:'main'},
          h('div', {className:'banner red'},
            h('span', {'aria-hidden':'true'}, '！'),
            h('span', null, '畫面發生錯誤，已停在安全狀態。重新整理頁面即可從頭開始（本網站不保存任何資料）。')),
          h('div', {className:'btnrow'},
            h('button', {className:'btn', onClick:function(){ window.location.reload(); }},
              '重新整理'))));
    }
    return this.props.children;
  };
  return B;
})();

var rootEl = document.getElementById('root');
rootEl.innerHTML = '';
ReactDOM.createRoot(rootEl).render(h(Boundary, null, h(App)));
} catch(err){
  var el = document.getElementById('root');
  if(el) el.innerHTML =
    '<div style="padding:24px;font-family:system-ui;line-height:1.7">' +
    '<b>網站啟動時發生錯誤</b><br>請重新整理頁面再試一次。</div>';
}
})();
</script>
