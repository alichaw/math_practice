<title>會考數學公式教練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Archivo+Black&display=swap">
<style>
/* ── tokens ─────────────────────────────────────────────────────────── */
:root{
  /* 紙：冷白偏藍，像剛拆封的方格筆記本 */
  --paper:#EEF3FA; --sheet:#FFFFFF; --sheet-2:#E7EEF8;
  /* 字：原子筆的藍黑 */
  --ink:#0E1B2E; --ink-soft:#49607E; --ink-faint:#8397B2;
  /* 主色：亮青綠，按鈕與正確 */
  --teal:#00B39A; --teal-bg:#D5F7F1; --teal-line:#00806E;
  /* 螢光橘：提醒 */
  --amber:#D97600; --amber-bg:#FFEDD2; --amber-line:#FFBE5C;
  /* 螢光粉：錯誤 */
  --red:#E11D63; --red-bg:#FFE0EC; --red-line:#FF8FB8;
  --rule:#CEDBEB; --rule-soft:#E3EBF6;
  --focus:#00B39A;
  --shadow:0 1px 0 rgba(14,27,46,.06);
  /* 螢光筆：劃重點用的半透明黃綠 */
  --hl:rgba(214,255,61,.75); --hl-solid:#D6FF3D;

  /* 間距：4 的倍數，全站只用這六個值 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  /* 圓角：四階，依「這個東西有多大塊」選 */
  --r1:4px;    /* 晶片、輸入框、清單列 */
  --r2:8px;    /* 有份量的區塊 */
  --r3:12px;   /* 主按鈕、主卡 */
  --rf:999px;  /* 藥丸、進度條 */
  /* 字級 */
  --t-2xs:10.5px;  /* 全大寫小標 */
  --t-xs:11.5px;   /* 註解、次要資訊 */
  --t-sm:13px;     /* 小字內文 */
  --t-md:15px;     /* 內文 */
  --t-lg:17px;     /* 標題 */
  --t-xl:22px;     /* 大標 */
  --t-num:34px;    /* 儀表板數字 */
  --t-hero:46px;   /* 首頁與結算的主數字 */

  /* 遊戲感的重點色：取自學生常用的螢光筆 */
  --hot:#FF2D7A; --hot-bg:#FFE0EC;
  --gold:#FF9500; --gold-bg:#FFEEDA;
  --win:#00C765; --win-bg:#D6F9E5;
  --grape:#7C5CFF; --grape-bg:#EAE4FF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0A1220; --sheet:#111C2E; --sheet-2:#17253B;
    --ink:#EAF1FB; --ink-soft:#9DB2CE; --ink-faint:#6F87A6;
    --teal:#2BE0C4; --teal-bg:#07332D; --teal-line:#12796A;
    --amber:#FFB020; --amber-bg:#3A2708; --amber-line:#8A5E12;
    --red:#FF5C97; --red-bg:#3B0E24; --red-line:#8C2450;
    --rule:#2A3B53; --rule-soft:#1E2E45;
    --focus:#2BE0C4;
    --shadow:0 1px 0 rgba(0,0,0,.35);
    --hl:rgba(214,255,61,.28); --hl-solid:#D6FF3D;
    --hot:#FF5C97; --hot-bg:#3B0E24;
    --gold:#FFB020; --gold-bg:#3A2708;
    --win:#2BE08A; --win-bg:#06331F;
    --grape:#A78BFF; --grape-bg:#241A45;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1220; --sheet:#111C2E; --sheet-2:#17253B;
  --ink:#EAF1FB; --ink-soft:#9DB2CE; --ink-faint:#6F87A6;
  --teal:#2BE0C4; --teal-bg:#07332D; --teal-line:#12796A;
  --amber:#FFB020; --amber-bg:#3A2708; --amber-line:#8A5E12;
  --red:#FF5C97; --red-bg:#3B0E24; --red-line:#8C2450;
  --rule:#2A3B53; --rule-soft:#1E2E45;
  --focus:#2BE0C4;
  --shadow:0 1px 0 rgba(0,0,0,.35);
  --hl:rgba(214,255,61,.28); --hl-solid:#D6FF3D;
  --hot:#FF5C97; --hot-bg:#3B0E24;
  --gold:#FFB020; --gold-bg:#3A2708;
  --win:#2BE08A; --win-bg:#06331F;
  --grape:#A78BFF; --grape-bg:#241A45;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:var(--t-md); line-height:1.65; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r1)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── shell ──────────────────────────────────────────────────────────── */
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--sheet);
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;overflow-x:hidden;
  /* 方格筆記本的底紋，淡到不干擾閱讀 */
  background-image:linear-gradient(var(--rule-soft) 1px,transparent 1px),
    linear-gradient(90deg,var(--rule-soft) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
@media (max-width:479px){.app{border-left:none;border-right:none}}
.topbar{position:sticky;top:0;z-index:30;background:var(--sheet);
  border-bottom:1px solid var(--rule);padding:10px 16px 8px;
  display:flex;align-items:baseline;gap:var(--s2)}
.topbar h1{margin:0;font-family:"Noto Sans TC",sans-serif;font-weight:900;
  font-size:var(--t-lg);letter-spacing:.01em}
.topbar .sub{margin-left:auto;font-size:var(--t-lg);line-height:1;width:40px;height:40px;
  border-radius:var(--rf);display:flex;align-items:center;justify-content:center;
  transition:background-color .15s ease}
.topbar .sub:hover{background:var(--sheet-2)}
.main{flex:1;padding:14px 16px 92px}

/* ── bottom nav ─────────────────────────────────────────────────────── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--sheet);
  border-top:1px solid var(--rule);display:flex;
  max-width:460px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0)}
.nav button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s1);color:var(--ink-soft);font-size:var(--t-xs);letter-spacing:.02em;
  border-top:2px solid transparent;margin-top:-1px;transition:color .18s ease,border-color .18s ease}
.nav button[aria-current="page"]{color:var(--ink);border-top-color:transparent;font-weight:700}
.nav button[aria-current="page"] span:last-child{position:relative;isolation:isolate}
.nav button[aria-current="page"] span:last-child::before{content:"";position:absolute;z-index:-1;
  left:-.3em;right:-.3em;bottom:-.04em;height:.7em;
  background:var(--hl);border-radius:.32em .5em .28em .46em;transform:rotate(-1deg)}
.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ── structural type ────────────────────────────────────────────────── */
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:var(--t-2xs);font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
.secthead{display:flex;align-items:baseline;gap:var(--s3);margin:20px 0 8px}
.secthead:first-child{margin-top:4px}
.secthead .line{flex:1;height:1px;background:var(--rule-soft)}
.kindline{display:flex;align-items:baseline;gap:var(--s2)}
.toastwrap{position:fixed;left:0;right:0;bottom:70px;z-index:50;display:flex;
  justify-content:center;pointer-events:none;padding:0 var(--s4)}
.toastwrap>*{max-width:400px}
.secthead .right{font-family:"IBM Plex Mono",monospace;font-size:var(--t-xs);color:var(--ink-faint)}
.secthead h2{margin:0;font-family:"Noto Sans TC",sans-serif;font-size:var(--t-md);font-weight:900}
h3{font-family:"Noto Sans TC",sans-serif;font-size:var(--t-md);font-weight:900;margin:0;text-wrap:balance}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}

/* ── note block ─────────────────────────────────────────────────────── */
/* ── 排版原語 ──────────────────────────────────────────────────
   全站只有兩個：.stack 垂直堆疊、.panel 內容分段（堆疊 + 段間細線）。
   間距一律用 --gap 調，不在元素上寫 margin。
   有邊框的盒子只留給「可以點的東西」與需要框住的作答區。 */
.stack{display:flex;flex-direction:column;gap:var(--gap,var(--s3))}
.stack.tight{--gap:var(--s2)}
.stack.loose{--gap:var(--s4)}
.panel{display:flex;flex-direction:column;gap:var(--gap,var(--s3))}
.panel:not(:first-child){margin-top:var(--s5);padding-top:var(--s5);
  border-top:1px solid var(--rule-soft)}
/* ══ 螢光筆 ══════════════════════════════════════════════════════
   只用在三個「劃重點」的時刻：要背的公式、選對的答案、你在哪一頁。
   兩端不對稱的圓角 + 微微歪斜，做出手畫的痕跡。 */
.swipe{position:relative;isolation:isolate}
.swipe::before{content:"";position:absolute;z-index:-1;
  left:-.2em;right:-.2em;bottom:.04em;height:.66em;
  background:var(--hl);border-radius:.32em .5em .28em .46em;
  transform:rotate(-.7deg)}

/* ══ 遊戲感：連續天數、XP、連對、彩帶、答題回饋 ══════════════════ */
.confetti{position:fixed;inset:0;z-index:90;pointer-events:none}

/* 練習時最上面那條：連續天數 · 今日目標 · 本輪 XP */
.hud{display:flex;align-items:center;gap:var(--s3);margin-bottom:12px}
.hud .pill{display:inline-flex;align-items:center;gap:var(--s1);padding:6px 12px;border-radius:var(--rf);
  font-family:"Archivo Black","IBM Plex Mono",monospace;font-size:var(--t-sm);
  font-variant-numeric:tabular-nums;border:1px solid transparent;white-space:nowrap}
.hud .pill.fire{background:var(--gold-bg);color:var(--gold);border-color:var(--gold)}
.hud .pill.xp{background:var(--grape-bg);color:var(--grape);border-color:var(--grape)}
.hud .pill.combo{background:var(--hot-bg);color:var(--hot);border-color:var(--hot);
  animation:pop .34s cubic-bezier(.2,1.6,.4,1)}
.hud .spacer{flex:1}


/* 答對／答錯的整頁閃動 */
.flash{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0}
.flash.ok{background:radial-gradient(circle at 50% 42%,var(--win-bg),transparent 62%);
  animation:flashin .5s ease-out}
.flash.bad{background:radial-gradient(circle at 50% 42%,var(--hot-bg),transparent 62%);
  animation:flashin .5s ease-out}
@keyframes flashin{0%{opacity:0}18%{opacity:.8}100%{opacity:0}}

/* 飛出來的 +XP */
.xpfly{position:fixed;left:50%;top:148px;z-index:85;pointer-events:none;
  transform:translateX(-50%);font-family:"IBM Plex Mono",monospace;
  font-size:var(--t-num);font-weight:700;color:#FFFDF8;background:var(--win);
  padding:4px 16px;border-radius:var(--rf);white-space:nowrap;
  box-shadow:0 6px 18px rgba(18,168,124,.35);
  animation:fly 1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}
  22%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-74px) scale(1)}}

/* 答錯時題目輕輕搖一下 */
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* 結算畫面 */
.result{display:flex;flex-direction:column;align-items:center;gap:var(--s2);
  padding:26px 0 18px;text-align:center}
.result .crown{font-size:var(--t-hero);line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.result h2{margin:0;font-family:"Noto Sans TC",sans-serif;font-size:var(--t-xl);font-weight:900}
.result .sub{font-size:var(--t-sm);color:var(--ink-soft)}
.scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);width:100%;margin-top:14px}
.scoreboard>div{background:var(--sheet-2);border:1px solid var(--rule);border-radius:var(--r2);
  padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:var(--s1)}
.scoreboard .n{font-family:"Archivo Black","IBM Plex Mono",monospace;font-size:var(--t-xl);
  font-variant-numeric:tabular-nums;line-height:1}
.scoreboard .n.gold{color:var(--gold)} .scoreboard .n.win{color:var(--win)}
.scoreboard .n.grape{color:var(--grape)}
.scoreboard .l{font-size:var(--t-xs);color:var(--ink-soft)}

/* 每日目標圈 */
.goalring{display:flex;align-items:center;gap:var(--s3)}
.goalring svg{flex:none;transform:rotate(-90deg)}
.goalring .ring-bg{stroke:var(--rule);fill:none;stroke-width:8}
.goalring .ring-fg{stroke:var(--win);fill:none;stroke-width:8;stroke-linecap:round;
  transition:stroke-dasharray .5s cubic-bezier(.2,.9,.3,1)}
.goalring .ring-fg.done{stroke:var(--gold)}

/* 連續天數大字 */
.streakbig{display:flex;align-items:center;gap:var(--s2);
  font-family:"Archivo Black","IBM Plex Mono",monospace;
  font-size:var(--t-num);color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.streakbig .flame{font-size:var(--t-num)}
.streakbig .unit{font-size:var(--t-sm);font-weight:400;color:var(--ink-soft);
  font-family:"Noto Sans TC",sans-serif}
/* 本週：一天一格，練過就塗上螢光筆 */
.week{display:flex;gap:var(--s1);align-items:flex-end}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.week .box{width:100%;aspect-ratio:1;max-width:34px;border-radius:var(--r1);
  border:1px solid var(--rule);background:var(--sheet);
  display:flex;align-items:center;justify-content:center;
  font-family:"Archivo Black","IBM Plex Mono",monospace;font-size:var(--t-sm);
  color:var(--ink-faint)}
.week .box.hit{background:var(--hl);border-color:var(--hl-solid);color:var(--ink)}
.week .box.today{border-width:2px;border-color:var(--teal)}
.week .lbl{font-size:var(--t-2xs);color:var(--ink-faint)}
.streakbig.cold{color:var(--ink-soft)}

/* 主按鈕做大一點、按下去會凹 */
.btn.primary{border-radius:var(--r3);font-size:var(--t-lg);min-height:52px;
  box-shadow:0 3px 0 var(--teal-line);transition:transform .08s ease,box-shadow .08s ease}
.btn.primary:active{transform:translateY(3px);box-shadow:0 0 0 var(--teal-line)}
.btn.primary:disabled{box-shadow:none}

/* 選項按下去有反應 */
.opt{transition:border-color .15s ease,background-color .15s ease,transform .08s ease}
.opt:active:not(:disabled){transform:scale(.985)}
.opt.ok{animation:pop .34s cubic-bezier(.2,1.6,.4,1)}

@media (prefers-reduced-motion:reduce){
  .xpfly,.flash,.result .crown,.hud .pill.combo,.opt.ok{animation:none}
  .shake{animation:none}
}

/* 首頁主卡：今天要做什麼 */
.todo{background:var(--sheet-2);border:1px solid var(--rule);border-radius:var(--r2);
  padding:14px;display:flex;flex-direction:column;gap:var(--s3)}
.todo-head{display:flex;align-items:baseline;justify-content:space-between}
.todo-lead{display:flex;align-items:center;gap:var(--s4)}
.todo-lead .big{font-size:var(--t-hero);color:var(--teal)}
.todo .btn{width:100%}

/* 一句話的空狀態，不再佔一整個盒子 */
.emptyline{font-size:var(--t-sm);color:var(--ink-faint);padding:2px 0}

/* 章節／原因：一行一條，名稱、數字、進度線並排 */
.catrow{display:grid;grid-template-columns:1fr auto;gap:var(--s1) var(--s3);align-items:baseline}
.catrow .catname{font-size:var(--t-sm)}
.catrow .catnum{font-family:"IBM Plex Mono",monospace;font-size:var(--t-sm);color:var(--ink-soft);
  font-variant-numeric:tabular-nums}
.catrow .bar{grid-column:1/-1;margin-top:1px}

/* 卡片搜尋 */
.search{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--rule);
  border-radius:var(--r1);background:var(--sheet);font-size:var(--t-md);margin-bottom:8px}
.search::placeholder{color:var(--ink-faint)}

/* 收合次要細節：一個畫面最多一個 */
details.more{border-top:1px solid var(--rule-soft);margin-top:14px}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:var(--s2);
  padding:11px 0 10px;font-size:var(--t-sm);font-weight:500;color:var(--ink-soft);min-height:44px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:7px;height:7px;margin-left:auto;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translateY(-2px);transition:transform .18s ease}
details.more[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
details.more>summary:hover{color:var(--ink)}
details.more .morebody{display:flex;flex-direction:column;gap:var(--s4);padding-bottom:4px}

/* 作答時的動作列釘在畫面底部，拇指按得到 */
.actionbar{position:sticky;bottom:0;z-index:20;margin:14px -16px 0;padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,transparent,var(--sheet) 22%);
  display:flex;gap:var(--s2)}
.actionbar .btn{width:auto;flex:1}
.actionbar .btn.ghost{flex:0 0 auto;min-width:96px}
.rulebox{border-left:1px solid var(--rule);padding-left:14px;margin-left:3px}

/* margin-rule list: real sequences only */
ol.steps{list-style:none;margin:0;padding:0 0 0 30px;position:relative}
ol.steps::before{content:"";position:absolute;left:14px;top:4px;bottom:4px;width:1px;background:var(--rule)}
ol.steps li{position:relative;margin-bottom:10px}
ol.steps li:last-child{margin-bottom:0}
ol.steps li::before{content:counter(sc);counter-increment:sc;position:absolute;left:-30px;width:21px;
  text-align:right;font-family:"IBM Plex Mono",monospace;font-size:var(--t-xs);font-weight:600;
  color:var(--ink-faint);top:2px}
/* 巢狀時只留外層的邊界線，避免兩條平行的直線 */
.rulebox ol.steps{padding-left:26px}
.rulebox ol.steps::before{display:none}
.rulebox ol.steps li::before{left:-26px;width:17px}
ol.steps{counter-reset:sc}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{position:relative;padding-left:15px;margin-bottom:6px}
ul.plain li:last-child{margin-bottom:0}
ul.plain li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:1px;background:var(--ink-faint)}

/* ── tags ───────────────────────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:var(--s1);font-size:var(--t-xs);line-height:1.5;
  padding:1px 7px;border-radius:var(--r1);border:1px solid var(--rule);color:var(--ink-soft);
  background:var(--sheet-2);white-space:nowrap}
.tag.amber{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.tag.teal{color:var(--teal);border-color:var(--teal-line);background:var(--teal-bg)}
.tag.red{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}
.tag.ghost{background:transparent}
.tagrow{display:flex;flex-wrap:wrap;gap:var(--s1)}

/* ── buttons ────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:44px;padding:10px 16px;border-radius:var(--r1);border:1px solid var(--ink);
  background:var(--ink);color:var(--sheet);font-weight:700;font-size:var(--t-md);width:100%;
  transition:opacity .18s ease,background-color .18s ease}
.btn:hover{opacity:.88}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#FBFEFD}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#0B1F1A}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule);font-weight:500}
